/* --- Job sheet --- */
function renderSheet(){
  const root = $("#sheetRoot");
  const j = S.jobs.find(x => x.id === S.sheet.id);
  if (!j){ root.innerHTML = ""; S.sheet = null; return; }
  if (S.sheet.rendered && S.sheet.sig === j.updatedAt) return;
  const keepScroll = root.querySelector(".sheet")?.scrollTop || 0;
  S.sheet.rendered = true; S.sheet.sig = j.updatedAt;
  const p = perms(S.role), now = Date.now(), w = S.canWrite;
  const statusSec = (p.status && w) ? '<div class="sec"><h3>Status</h3><div class="seg">' + Object.keys(STATUS).map(k => '<button data-action="set-status" data-s="' + k + '" aria-pressed="' + (j.status === k) + '">' + STATUS[k] + '</button>').join("") + '</div></div>'
    : (p.deliver && w && j.status === "ready") ? '<div class="sec"><button class="btn primary big" data-action="set-status" data-s="delivered">Mark delivered</button></div>' : "";
  const prodSec = (p.products && w)
    ? '<div class="sec" id="prodSec"><h3>Protection products</h3><div class="chips" data-form="prods">' + products().concat((j.products || []).filter(x => !products().includes(x))).map(x => '<label class="chip-opt"><input type="checkbox" value="' + esc(x) + '"' + ((j.products || []).includes(x) ? " checked" : "") + '><span>' + esc(x) + '</span></label>').join("") + '</div><div class="row" style="margin-top:12px"><button class="btn primary" data-action="save-prods">Save products</button></div></div>'
    : (j.products && j.products.length ? '<div class="sec"><h3>Protection products</h3><div class="chips">' + j.products.map(x => '<span class="pill">' + esc(x) + '</span>').join("") + '</div></div>' : "");
  const dueLocal = j.dueAt ? new Date(j.dueAt - new Date(j.dueAt).getTimezoneOffset() * MIN).toISOString().slice(0,16) : "";
  const editSec = (p.edit && w) ? '<details class="sec"><summary style="font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center">Edit details</summary><form class="form" data-form="edit" style="margin-top:12px">' +
    '<label class="field"><span>Stock number</span><input class="input" name="stock" value="' + esc(j.stock) + '"></label>' +
    '<div class="grid3"><input class="input" name="year" value="' + esc(j.year) + '" aria-label="Year" placeholder="Year"><input class="input" name="make" value="' + esc(j.make) + '" aria-label="Make" placeholder="Make"><input class="input" name="model" value="' + esc(j.model) + '" aria-label="Model" placeholder="Model"></div>' +
    '<label class="field"><span>Color</span><input class="input" name="color" value="' + esc(j.color) + '"></label>' +
    '<label class="field"><span>Salesperson</span><input class="input" name="salesperson" value="' + esc(j.salesperson) + '"></label>' +
    '<label class="field"><span>Ready by</span><input class="input" type="datetime-local" name="due" value="' + esc(dueLocal) + '"></label>' +
    '<div class="toggle-row"><label class="chip-opt"><input type="checkbox" name="waiting"' + (j.waiting ? " checked" : "") + '><span>Customer waiting</span></label></div>' +
    '<label class="field"><span>Notes</span><textarea class="input" name="notes">' + esc(j.notes) + '</textarea></label>' +
    '<button class="btn primary" type="submit">Save changes</button></form></details>' : "";
  const delSec = (p.del && w) ? '<div class="sec"><button class="btn danger" data-action="del-job">' + (S.sheet.confirmDel ? "Tap again to remove for good" : "Remove from board") + '</button></div>' : "";
  // Survey mode: only the rating, nothing else (no products, status, edit or remove).
  if (S.sheet.focus === "review"){
    const rv = reviewSection(j);
    if (rv.indexOf('data-action="rv-save"') >= 0){
      root.innerHTML = '<div class="backdrop" data-action="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
        '<div class="sheet-head"><div style="flex:1;min-width:0"><div class="muted">#' + esc(j.stock) + '  ·  ' + esc(storeName(j.store)) + '</div><h2 id="sheetTitle">' + esc(vehicle(j)) + '</h2>' +
        '<div class="muted" style="margin-top:4px">Delivered ' + esc(fmtTime(j.deliveredAt)) + '</div></div><button class="x" data-action="close" aria-label="Close">×</button></div>' +
        rv.replace('<div class="sec" id="rvSec">', '<div class="sec" id="rvSec" style="border-top:0;margin-top:8px">') + '</div></div>';
      return;
    }
  }
  root.innerHTML = '<div class="backdrop" data-action="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
    '<div class="sheet-head"><div style="flex:1;min-width:0"><div class="muted">#' + esc(j.stock) + '  ·  ' + esc(storeName(j.store)) + '</div><h2 id="sheetTitle">' + esc(vehicle(j)) + '</h2><div class="row" style="margin-top:6px"><span class="pill ' + j.status + '">' + STATUS[j.status] + '</span>' + (j.color ? '<span class="muted">' + esc(j.color) + '</span>' : "") + (j.rush ? '<span class="flag rush">Rush</span>' : "") + (j.waiting ? '<span class="flag wait">Customer waiting</span>' : "") + '</div></div><button class="x" data-action="close" aria-label="Close">×</button></div>' +
    '<div class="sec"><dl class="times"><div><dt>Salesperson</dt><dd>' + esc(j.salesperson || "—") + '</dd></div>' + (j.customer ? '<div><dt>Customer</dt><dd>' + esc(j.customer) + '</dd></div>' : "") +
      '<div><dt>Ready by</dt><dd>' + esc(fmtTime(j.dueAt)) + (j.status !== "delivered" && j.status !== "ready" ? ' (' + esc(dueText(j, now)) + ')' : "") + '</dd></div><div><dt>Sent to shop</dt><dd>' + esc(fmtTime(j.createdAt)) + '</dd></div>' +
      (j.status !== "delivered" ? '<div><dt>On board</dt><dd>' + esc(fmtDur(now - j.createdAt)) + '</dd></div>' : "") +
      (j.readyAt ? '<div><dt>Turn time</dt><dd>' + esc(fmtDur(j.readyAt - j.createdAt)) + '</dd></div>' : "") + '</dl>' +
      (j.notes ? '<p style="margin:12px 0 0"><b>Notes:</b> ' + esc(j.notes) + '</p>' : "") + '</div>' +
    statusSec + reviewSection(j) + prodSec + editSec +
    '<div class="sec"><h3>Activity</h3><ul class="log">' + (j.log || []).slice().reverse().slice(0, 12).map(l => '<li><b>' + esc(l.a) + '</b> by ' + esc(l.by) + ', ' + esc(fmtTime(l.t)) + '</li>').join("") + '</ul></div>' +
    delSec + '</div></div>';
  const sh = root.querySelector(".sheet"); sh.scrollTop = keepScroll;
  if (S.sheet.focus === "products" && !S.sheet.focused){ S.sheet.focused = true; root.querySelector("#prodSec")?.scrollIntoView({block:"center"}); }
  if (S.sheet.focus === "review" && !S.sheet.focused){ S.sheet.focused = true; root.querySelector("#rvSec")?.scrollIntoView({block:"center"}); }
}
function openSheet(id, focus){ S.sheet = { id, focus }; renderSheet(); setTimeout(() => $("#sheetRoot .x")?.focus(), 30); }
function closeSheet(){ S.sheet = null; $("#sheetRoot").innerHTML = ""; }
function addLog(j, a){ return (j.log || []).concat([{ t: Date.now(), by: S.me || ROLES[S.role].label, a }]).slice(-30); }
async function setStatus(j, to){
  if (j.status === to) return;
  const patch = { status: to, log: addLog(j, "Moved to " + STATUS[to]) };
  if (to === "working" && !j.startedAt) patch.startedAt = Date.now();
  if (to === "ready") patch.readyAt = Date.now();
  if (to === "delivered") patch.deliveredAt = Date.now();
  if (to === "queued"){ patch.readyAt = null; patch.deliveredAt = null; }
  try{ await api.update(j.id, patch); toast(vehicle(j) + " is now " + STATUS[to].toLowerCase()); if (to === "delivered") promptReview(j.id); }catch(e){}
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-action]"); if (!t) return;
  const a = t.dataset.action;
  if (a === "close-bg"){ if (e.target === t) closeSheet(); return; }
  if (t.tagName === "SELECT" || t.tagName === "INPUT") return;
  const job = id => S.jobs.find(j => j.id === (id || t.dataset.id || (S.sheet && S.sheet.id)));
  switch (a){
    case "release-start": S.releasing = true; render(true); break;
    case "release-cancel": S.releasing = false; render(true); break;
    case "pick-role": S.role = t.dataset.role; LS.set("role", S.role); S.view = null; S.skipName = false; render(true); break;
    case "switch-role": S.role = null; S.unlock = null; LS.set("unlock", null); S.releasing = false; LS.set("role", null); S.tv = false; render(true); break;
    case "pick-store": setUnlock(t.dataset.store); render(true); break;
    case "tab": if (S.vsPreview){ S.vsPreview = null; if (S.vsBack) S.store = S.vsBack; } S.view = t.dataset.tab; S.addDone = null; render(true); window.scrollTo(0,0); break;
    case "filter": S.filter = t.dataset.f; render(true); break;
    case "vs-toggle": case "vs-all": {
      if (S.role !== "area" || S.vsBusy) break;
      const tgt = vsTarget(), cur = vsPrefs(vsShown()), ch = {};
      if (a === "vs-toggle") ch[t.dataset.k] = !cur[t.dataset.k]; else VS_SECTIONS.forEach(([k]) => ch[k] = t.dataset.on === "1");
      S.vsBusy = true;
      try{ await vsSave(tgt, ch); toast("Dealership view updated for " + (tgt === "__all" ? "every store" : storeName(tgt))); }
      catch(err){ toast("Couldn't change it. Nothing was changed. Try again.", true); }
      S.vsBusy = false; render(true); break;
    }
    case "vs-preview": if (S.role !== "area") break; S.vsPreview = vsShown(); S.vsBack = S.store; S.store = S.vsPreview; S.view = "view"; render(true); window.scrollTo(0,0); break;
    case "vs-unpreview": S.vsPreview = null; if (S.vsBack) S.store = S.vsBack; S.view = "settings"; render(true); break;
    case "vs-drill": vsDrill(t.dataset.k); break;
    case "vs-rank": LS.set("rankBy", t.dataset.p); render(true); break;
    case "open": openSheet(t.dataset.id, t.dataset.focus); break;
    case "close": closeSheet(); break;
    case "advance": { const j = job(); const n = j && nextStep(j); if (n) await setStatus(j, n.to); break; }
    case "set-status": { const j = job(); if (j) await setStatus(j, t.dataset.s); break; }
    case "save-prods": { const j = job(); if (!j) break;
      const sel = [...document.querySelectorAll('[data-form="prods"] input:checked')].map(i => i.value);
      try{ await api.update(j.id, { products: sel, log: addLog(j, "Products updated (" + (sel.length ? sel.join(", ") : "none") + ")") }); toast("Products saved"); }catch(err){} break; }
    case "del-job": { const j = job(); if (!j) break;
      if (!S.sheet.confirmDel){ S.sheet.confirmDel = true; S.sheet.rendered = false; renderSheet(); setTimeout(() => { if (S.sheet){ S.sheet.confirmDel = false; S.sheet.rendered = false; renderSheet(); } }, 5000); break; }
      try{ await api.remove(j.id); closeSheet(); toast("Removed from the board"); }catch(err){} break; }
    case "add-another": S.addDone = null; render(true); break;
    case "dive": S.store = t.dataset.store; LS.set("store", S.store); S.view = t.dataset.to; render(true); window.scrollTo(0,0); break;
    case "sound":
      S.sound = !S.sound;
      if (S.sound){ try{ audio = audio || new (window.AudioContext || window.webkitAudioContext)(); await audio.resume(); }catch(err){} chime(); }
      LS.set("sound", S.sound); render(true); break;
    case "tv":
      S.tv = !S.tv;
      try{ if (S.tv && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); else if (!S.tv && document.fullscreenElement) await document.exitFullscreen(); }catch(err){}
      render(true); break;
    case "del-store": {
      const id = t.dataset.id, n = activeJobs(id).length;
      if (n){ toast("That store still has " + n + " unit" + (n > 1 ? "s" : "") + " on its board. Clear them first.", true); break; }
      await api.saveConfig(Object.assign({}, S.config, { stores: stores().filter(s => s.id !== id) })).catch(()=>{}); render(true); break; }
    case "del-prod": await api.saveConfig(Object.assign({}, S.config, { products: products().filter(p => p !== t.dataset.p) })).catch(()=>{}); render(true); break;
    case "gen-codes": {
      const used = allCodes();
      const next = stores().map(s => { const o = Object.assign({}, s); if (!o.code){ o.code = newCode(used); used.push(o.code); } return o; });
      await api.saveConfig(Object.assign({}, S.config, { stores: next })).catch(()=>{}); render(true); break; }
    case "logo-clear": await api.saveConfig(Object.assign({}, S.config, { logoId: null })).catch(()=>{}); render(true); break;
    case "cleanup": {
      const old = S.jobs.filter(j => j.status === "delivered" && (j.deliveredAt || 0) < Date.now() - 90 * 24 * HOUR);
      if (!old.length){ toast("Nothing to clear."); break; }
      t.disabled = true;
      for (const j of old){ try{ await api.remove(j.id); }catch(err){ break; } }
      toast("Cleared " + old.length + " old units"); render(true); break; }
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.action === "store"){ S.store = t.value; LS.set("store", S.store); render(true); }
  if (t.dataset.action === "rename-store"){
    const name = t.value.trim(); if (!name) return;
    await api.saveConfig(Object.assign({}, S.config, { stores: stores().map(s => s.id === t.dataset.id ? Object.assign({}, s, { name }) : s) })).catch(()=>{});
    toast("Store renamed");
  }
  if (t.dataset.action === "store-code" || t.dataset.action === "master-pin"){
    const v = t.value.trim();
    if (!/^\d{4,6}$/.test(v)){ toast("Codes need to be 4 to 6 digits.", true); render(true); return; }
    const mine = t.dataset.action === "master-pin" ? String(S.config.masterPin) : String((stores().find(s => s.id === t.dataset.id) || {})[t.dataset.k] || "");
    if (v !== mine && allCodes().includes(v)){ toast("That code is already used. Every code has to be different.", true); render(true); return; }
    if (t.dataset.action === "master-pin"){ await api.saveConfig(Object.assign({}, S.config, { masterPin: v })).catch(()=>{}); setUnlock("*"); toast("Area manager PIN saved"); render(true); return; }
    await api.saveConfig(Object.assign({}, S.config, { stores: stores().map(s => s.id === t.dataset.id ? Object.assign({}, s, { [t.dataset.k]: v }) : s) })).catch(()=>{});
    toast("Code saved"); return;
  }
  if (false){
    try{}
    catch(err){ toast("That logo didn't upload. Try a PNG or SVG under 2 MB.", true); }
  }
});
document.addEventListener("submit", async e => {
  const f = e.target; e.preventDefault();
  const kind = f.dataset.form;
  if (kind === "add") return submitAdd(f);
  if (kind === "code") return tryCode(f);
  if (kind === "release"){
    const v = String(f.code.value || "").trim();
    if (Date.now() < codeWaitUntil){ $("#codeErr").innerHTML = '<div class="err-msg">Too many tries. Wait a minute.</div>'; return; }
    if (S.config.masterPin && v === String(S.config.masterPin)){ S.lock = null; LS.set("lock", null); S.releasing = false; toast("Store unlocked. Pick a role, then enter the new store’s code."); render(true); }
    else { codeTries++; if (codeTries >= 5){ codeTries = 0; codeWaitUntil = Date.now() + 60000; } $("#codeErr").innerHTML = '<div class="err-msg" role="alert">That PIN didn’t match.</div>'; f.code.value = ""; }
    return;
  }
  if (kind === "name"){ const v = f.me.value.trim(); if (!v) return; S.me = v; LS.set("me", v); render(true); return; }
  if (kind === "rename"){
    const v = f.me.value.trim().slice(0, 60);
    if (!v){ $("#renameMsg").innerHTML = '<div class="err-msg" role="alert">Enter a name.</div>'; return; }
    S.me = v; LS.set("me", v); f.me.blur(); toast("Name saved: " + v); render(true); return;
  }
  if (kind === "add-store"){
    const name = f.label.value.trim(); if (!name) return;
    if (stores().some(s => s.name.toLowerCase() === name.toLowerCase())){ toast("That store is already on the list.", true); return; }
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24) + "-" + uid().slice(0, 4);
    await api.saveConfig(Object.assign({}, S.config, { stores: stores().concat([(() => { const used = allCodes(); const code = newCode(used); return { id, name, code, mcode: "" }; })()]) })).catch(()=>{});
    render(true); document.querySelector('[data-form="add-store"] input')?.focus(); return;
  }
  if (kind === "add-prod"){
    const name = f.label.value.trim(); if (!name || products().includes(name)) return;
    await api.saveConfig(Object.assign({}, S.config, { products: products().concat([name]) })).catch(()=>{}); render(true); return;
  }
  if (kind === "edit"){
    const j = S.jobs.find(x => x.id === S.sheet.id); if (!j) return;
    const fd = new FormData(f), g = k => String(fd.get(k) || "").trim();
    const due = g("due") ? new Date(g("due")).getTime() : j.dueAt;
    if (!g("stock")){ toast("Stock number can't be blank.", true); return; }
    if (!isNaN(due) && Math.abs(due - (j.dueAt || 0)) > MIN && due < Date.now() + HOUR - MIN){ toast("Ready time has to be at least 1 hour from now.", true); return; }
    try{
      await api.update(j.id, { stock: g("stock").toUpperCase(), year: g("year"), make: g("make"), model: g("model"), color: g("color"), salesperson: g("salesperson"),
        dueAt: isNaN(due) ? j.dueAt : due, waiting: !!fd.get("waiting"), rush: false, notes: g("notes"), log: addLog(j, "Details edited") });
      toast("Changes saved");
    }catch(err){}
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (S.sheet) closeSheet(); else if (S.tv){ S.tv = false; render(true); } } });
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && S.tv){ S.tv = false; render(true); } });

/* ---------- live ticking (display only, no writes) ---------- */
setInterval(() => {
  const now = Date.now();
  for (const [id, exp] of S.newIds) if (exp < now) S.newIds.delete(id);
  const cur = $("#main").dataset.view || "";
  if (!FORM_VIEWS.has(S.view) && cur !== "gate" && !typingNow()) renderMain();
}, 20000);

/* ---------- boot ---------- */
function handleJobsSnap(docs, changes){
  S.jobs = docs;
  const mine = S.store;
  changes.forEach(j => {
    if (j.createdAt > boot && (mine === "*" || j.store === mine)){
      S.newIds.set(j.id, Date.now() + 15 * MIN);
      if (S.view === "board" || S.role === "shop"){ arrival(j); chime(); }
    }
  });
  S.loaded = true; render();
}
function readCfg(d){
  d = d || {};
  S.config = { stores: (d.stores || []).map(s => ({ id: s.id, name: s.name, code: s.code || "", mcode: s.mcode || "" })), products: d.products ? d.products.slice() : null, logoId: null, masterPin: d.masterPin || "" };
}
async function loadAll(){
  const [c, jr] = await Promise.all([
    db.from("config").select("data").eq("id", "settings").maybeSingle(),
    db.from("jobs").select("id,data").order("created_at", { ascending: false }).limit(900)
  ]);
  if (c.error || jr.error) throw (c.error || jr.error);
  const before = new Set(S.jobs.map(j => j.id)), first = !S.loaded;
  readCfg(c.data && c.data.data);
  const docs = jr.data.map(r => Object.assign({ id: r.id }, r.data));
  const added = first ? [] : docs.filter(d => !before.has(d.id) && !mine.has(d.id));
  S.online = true;
  handleJobsSnap(docs, added);
}
render(true);
(async () => {
  const configured = window.supabase && SUPABASE_URL.startsWith("http") && SUPABASE_KEY.length > 20;
  if (!configured){ S.loaded = true; S.live = false; S.config = { stores: [{ id: "demo-1", name: "Demo store" }], products: null, logoId: null }; render(true); return; }
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
  S.live = true;
  let lastSync = 0;
  const refresh = () => loadAll().then(() => { lastSync = Date.now(); S.lastErr = ""; renderShell(); })
    .catch(e => { S.online = false; S.lastErr = (e && (e.message || e.code)) || "unknown"; renderShell(); });
  try{ await loadAll(); }catch(e){ S.loaded = true; S.online = false; render(true); }
  db.channel("board")
    .on("postgres_changes", { event: "*", schema: "public", table: "jobs" }, p => {
      if (p.eventType === "DELETE"){ S.jobs = S.jobs.filter(j => j.id !== (p.old && p.old.id)); render(); return; }
      const row = p.new; if (!row || !row.data) return;
      const j = Object.assign({ id: row.id }, row.data);
      const isNew = p.eventType === "INSERT" && !S.jobs.some(x => x.id === j.id) && !mine.has(j.id);
      upsertLocal(j); S.jobs.sort((a, b) => b.createdAt - a.createdAt);
      handleJobsSnap(S.jobs, isNew ? [j] : []);
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "config" }, p => {
      if (p.new && p.new.data){ readCfg(p.new.data); render(S.view === "settings"); }
    })
    .subscribe(status => { if (status === "SUBSCRIBED"){ S.rt = true; refresh(); } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") S.rt = false; });
  // Safety net: if live updates drop, check every 15 seconds; otherwise every 2 minutes. Also when the screen wakes up.
  setInterval(() => { if (!S.rt || Date.now() - lastSync > 120000) refresh(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  window.addEventListener("online", refresh);
})();
S.sound = false; // browsers need a tap each visit to allow sound
})();
</script>
