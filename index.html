<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teph Seal Delivery Board</title>
<meta name="theme-color" content="#1C4476">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Delivery Board">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#13202D; --muted:#5A6777; --line:#DCE2E9; --chip:#ECF0F5;
  --brand:#1C4476; --brand-ink:#FFFFFF;
  --ok:#1E8757; --warn:#B97F00; --bad:#C3352B; --ready:#1F5FA8;
  --shop-bg:#0E1A27; --shop-card:#162536; --shop-ink:#F1F4F8; --shop-muted:#98A9BC; --shop-line:#22374C;
  --shop-ok:#33B57A; --shop-warn:#F2B630; --shop-bad:#FF5A4E; --shop-ready:#5AA2F2;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0C151F; --surface:#142030; --ink:#E8EDF3; --muted:#98A7B8; --line:#25354A; --chip:#1C2A3B; --brand:#4D8FDA; }
}
:root[data-theme="dark"]{ --bg:#0C151F; --surface:#142030; --ink:#E8EDF3; --muted:#98A7B8; --line:#25354A; --chip:#1C2A3B; --brand:#4D8FDA; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ margin:0; }
body{ background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; }
img{ max-width:100%; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--brand); outline-offset:2px; }
.hidden{ display:none !important; }

/* Header */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line); }
.top-in{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:10px 16px; max-width:1400px; margin:0 auto; }
.logo{ justify-self:center; display:flex; align-items:center; height:56px; }
.logo img{ max-height:56px; width:auto; }
.logo-white{ display:none; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo-navy{ display:none; } :root:not([data-theme="light"]) .logo-white{ display:inline; } }
:root[data-theme="dark"] .logo-navy{ display:none; } :root[data-theme="dark"] .logo-white{ display:inline; }
.wordmark{ font-family:var(--cond); font-weight:700; font-size:28px; letter-spacing:.02em; color:var(--brand); line-height:1; }
.wordmark span{ color:var(--ink); font-weight:500; }
.top-left{ justify-self:start; min-width:0; }
.top-right{ justify-self:end; }
.store-select{ max-width:100%; padding:8px 30px 8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-weight:600; }
.role-btn{ border:1px solid var(--line); background:var(--chip); border-radius:999px; padding:7px 14px; font-weight:600; font-size:14px; white-space:nowrap; }
.tabs{ display:flex; gap:4px; padding:0 12px; max-width:1400px; margin:0 auto; overflow-x:auto; }
.tab{ border:0; background:none; padding:12px 14px; font-weight:600; color:var(--muted); border-bottom:3px solid transparent; white-space:nowrap; }
.tab[aria-current="page"]{ color:var(--ink); border-bottom-color:var(--brand); }
main{ max-width:1400px; margin:0 auto; padding:20px 16px 60px; }
.banner{ max-width:1400px; margin:12px auto 0; padding:10px 16px; border-radius:10px; background:var(--chip); color:var(--muted); font-size:14px; }

/* Generic */
h1,h2,h3{ font-family:var(--cond); font-weight:700; line-height:1.1; margin:0; }
h2{ font-size:28px; }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; }
.narrow{ max-width:640px; margin:0 auto; }
.muted{ color:var(--muted); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 16px; font-weight:600; min-height:44px; }
.btn.primary{ background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
.btn.danger{ color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%,var(--line)); }
.btn.big{ width:100%; min-height:58px; font-size:19px; border-radius:12px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.spacer{ flex:1; }

/* Forms */
.form{ display:grid; gap:18px; }
.field{ display:grid; gap:6px; }
.field > span{ font-weight:600; font-size:15px; }
.field > span em{ font-style:normal; color:var(--bad); }
.input{ width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface); font-size:17px; min-height:50px; }
textarea.input{ min-height:80px; resize:vertical; }
.input.err{ border-color:var(--bad); }
.err-msg{ color:var(--bad); font-size:14px; font-weight:600; }
.grid3{ display:grid; grid-template-columns:110px 1fr 1fr; gap:10px; }
@media (max-width:520px){ .grid3{ grid-template-columns:1fr 1fr; } .grid3 > :first-child{ grid-column:1 / -1; } }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip-opt{ position:relative; }
.chip-opt input{ position:absolute; opacity:0; inset:0; }
.chip-opt span{ display:inline-flex; align-items:center; min-height:46px; padding:8px 16px; border:2px solid var(--line); border-radius:999px; font-weight:600; background:var(--surface); user-select:none; }
.chip-opt input:checked + span{ border-color:var(--brand); background:color-mix(in srgb,var(--brand) 12%,var(--surface)); color:var(--brand); }
.chip-opt input:focus-visible + span{ outline:3px solid var(--brand); outline-offset:2px; }
.toggle-row{ display:flex; gap:10px; flex-wrap:wrap; }
.warn-box{ border:2px solid var(--warn); background:color-mix(in srgb,var(--warn) 10%,var(--surface)); border-radius:10px; padding:12px 14px; font-weight:600; }
.success{ text-align:center; padding:40px 20px; }
.success .check{ width:72px; height:72px; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center; margin:0 auto 16px; font-size:40px; }

/* Status pills */
.pill{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:700; background:var(--chip); white-space:nowrap; }
.pill.queued{ color:var(--muted); }
.pill.working{ background:color-mix(in srgb,var(--warn) 16%,transparent); color:var(--warn); }
.pill.ready{ background:color-mix(in srgb,var(--ready) 15%,transparent); color:var(--ready); }
.pill.delivered{ background:color-mix(in srgb,var(--ok) 15%,transparent); color:var(--ok); }
.flag{ display:inline-flex; padding:2px 8px; border-radius:6px; font-size:13px; font-weight:700; }
.flag.rush{ background:var(--bad); color:#fff; }
.flag.wait{ background:var(--warn); color:#1a1300; }

/* Queue list */
.filters{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
.filter{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-weight:600; min-height:42px; }
.filter[aria-pressed="true"]{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
.list{ display:grid; gap:10px; }
.job-row{ display:grid; grid-template-columns:6px 1fr auto; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px 12px 0; overflow:hidden; }
.job-row .bar{ align-self:stretch; border-radius:0 4px 4px 0; background:var(--line); }
.job-row.u-ok .bar{ background:var(--ok); } .job-row.u-warn .bar{ background:var(--warn); } .job-row.u-bad .bar{ background:var(--bad); } .job-row.u-ready .bar{ background:var(--ready); }
.job-main{ min-width:0; cursor:pointer; border:0; background:none; text-align:left; padding:0; }
.job-title{ font-family:var(--cond); font-size:22px; font-weight:700; line-height:1.15; }
.job-meta{ color:var(--muted); font-size:14px; display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:2px; }
.job-meta b{ color:var(--ink); font-weight:600; }
.job-act{ display:flex; gap:8px; align-items:center; }
@media (max-width:560px){ .job-row{ grid-template-columns:6px 1fr; } .job-act{ grid-column:2; } }
.empty{ text-align:center; padding:48px 20px; color:var(--muted); }
.empty h3{ color:var(--ink); font-size:24px; margin-bottom:6px; }

/* Board (shop TV) */
.board{ background:var(--shop-bg); color:var(--shop-ink); border-radius:18px; padding:20px; min-height:70vh; }
body.tv .board{ border-radius:0; min-height:100%; }
.board-head{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.board-head h2{ font-size:clamp(28px,3vw,48px); }
.board-head .clock{ font-family:var(--cond); font-size:clamp(24px,2.4vw,40px); font-weight:600; color:var(--shop-muted); }
.board-head .btn{ background:transparent; color:var(--shop-ink); border-color:var(--shop-line); }
.board-cols{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
@media (max-width:900px){ .board-cols{ grid-template-columns:1fr; } }
.col-head{ display:flex; align-items:baseline; justify-content:space-between; padding:0 4px 10px; border-bottom:2px solid var(--shop-line); margin-bottom:12px; }
.col-head h3{ font-size:clamp(22px,2vw,34px); }
.col-head .count{ font-family:var(--cond); font-size:clamp(28px,2.4vw,44px); font-weight:700; color:var(--shop-muted); }
.col{ display:grid; gap:12px; align-content:start; }
.card{ text-align:left; width:100%; border:0; color:inherit; background:var(--shop-card); border-radius:14px; padding:14px 16px 14px 20px; position:relative; overflow:hidden; }
.card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--shop-line); }
.card.u-ok::before{ background:var(--shop-ok); } .card.u-warn::before{ background:var(--shop-warn); } .card.u-bad::before{ background:var(--shop-bad); } .card.u-ready::before{ background:var(--shop-ready); }
.card.u-bad{ box-shadow:inset 0 0 0 2px var(--shop-bad); }
.card-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.stock{ font-family:var(--cond); font-weight:600; font-size:clamp(17px,1.4vw,24px); color:var(--shop-muted); }
.store-tag{ font-size:13px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--shop-line); color:var(--shop-ink); }
.veh{ font-family:var(--cond); font-size:clamp(26px,2.4vw,42px); font-weight:700; line-height:1.05; margin:4px 0 2px; }
.vcolor{ color:var(--shop-muted); font-size:clamp(16px,1.3vw,22px); }
.card-stats{ display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:4px 22px; margin-top:12px; }
.card-stats div:not(:first-child) dd{ white-space:nowrap; }
.card-stats dt{ font-size:clamp(12px,.9vw,15px); color:var(--shop-muted); }
.card-stats dd{ margin:0; font-family:var(--cond); font-weight:700; font-size:clamp(20px,1.7vw,30px); line-height:1.1; }
.card-stats .due-bad{ color:var(--shop-bad); } .card-stats .due-warn{ color:var(--shop-warn); } .card-stats .due-ok{ color:var(--shop-ok); }
.prods{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.prod{ font-size:clamp(13px,1vw,16px); font-weight:600; padding:3px 10px; border-radius:999px; border:1px solid var(--shop-line); color:var(--shop-ink); }
.card .flag{ font-size:clamp(13px,1vw,17px); }
.col-empty{ color:var(--shop-muted); padding:20px 4px; font-size:18px; }
@keyframes arrive{ 0%,100%{ box-shadow:0 0 0 0 transparent; } 50%{ box-shadow:0 0 0 6px var(--shop-ready); } }
.card.new{ animation:arrive 1.4s ease-in-out 8; }
.arrival{ position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 20px); transform:translateX(-50%); z-index:60; background:var(--shop-ready); color:#06121f; padding:18px 30px; border-radius:16px; font-family:var(--cond); font-weight:700; font-size:clamp(26px,3vw,48px); box-shadow:0 10px 40px rgba(0,0,0,.4); text-align:center; }
.arrival small{ display:block; font-family:var(--sans); font-size:clamp(15px,1.3vw,22px); font-weight:600; }
body.tv .top, body.tv .tabs, body.tv .banner{ display:none; }
body.tv main{ max-width:none; padding:0; }
body.tv{ background:var(--shop-bg); }
.tv-exit{ position:fixed; right:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); z-index:50; opacity:.35; background:var(--shop-card); color:var(--shop-ink); border:1px solid var(--shop-line); border-radius:10px; padding:8px 12px; font-weight:600; }
.tv-exit:hover,.tv-exit:focus-visible{ opacity:1; }
.board-logo{ height:56px; display:flex; align-items:center; }
.board-logo img{ max-height:56px; }
.board-logo .wordmark{ color:var(--shop-ready); } .board-logo .wordmark span{ color:var(--shop-ink); }

/* Stores overview */
.totals{ display:flex; gap:12px; flex-wrap:wrap; margin:12px 0 20px; }
.total{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 18px; min-width:130px; }
.total b{ display:block; font-family:var(--cond); font-size:34px; line-height:1; }
.total span{ color:var(--muted); font-size:14px; font-weight:600; }
.total.bad b{ color:var(--bad); }
.store-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; }
.store-tile{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:grid; gap:12px; }
.store-tile.has-bad{ border-color:var(--bad); box-shadow:inset 0 0 0 1px var(--bad); }
.store-tile h3{ font-size:24px; }
.tile-counts{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.tile-counts div{ background:var(--chip); border-radius:10px; padding:8px 10px; }
.tile-counts b{ display:block; font-family:var(--cond); font-size:28px; line-height:1; }
.tile-counts span{ font-size:13px; color:var(--muted); font-weight:600; }
.tile-line{ font-size:14px; color:var(--muted); }
.tile-line b{ color:var(--ink); }
.tile-line .bad{ color:var(--bad); font-weight:700; }
.mini{ display:grid; gap:4px; font-size:14px; }
.mini div{ display:flex; justify-content:space-between; gap:10px; }
.mini .over{ color:var(--bad); font-weight:700; }

/* Sheet */
.backdrop{ position:fixed; inset:0; background:rgba(5,12,20,.55); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
@media (min-width:700px){ .backdrop{ align-items:center; } }
.sheet{ background:var(--surface); color:var(--ink); width:100%; max-width:640px; max-height:92%; overflow:auto; border-radius:18px 18px 0 0; padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 24px); }
@media (min-width:700px){ .sheet{ border-radius:18px; } }
.sheet-head{ display:flex; gap:12px; align-items:flex-start; }
.sheet-head h2{ font-size:30px; }
.x{ border:0; background:var(--chip); width:44px; height:44px; border-radius:50%; font-size:22px; line-height:1; flex:none; }
.sec{ border-top:1px solid var(--line); padding-top:16px; margin-top:16px; }
.sec h3{ font-size:20px; margin-bottom:10px; }
.seg{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
@media (max-width:480px){ .seg{ grid-template-columns:repeat(2,1fr); } }
.seg button{ min-height:52px; border:2px solid var(--line); background:var(--surface); border-radius:10px; font-weight:700; }
.seg button[aria-pressed="true"]{ border-color:var(--brand); background:var(--brand); color:var(--brand-ink); }
/* delivery reviews add-on */
.seg.stars{ grid-template-columns:repeat(5,1fr); }
.rv-up{ color:var(--ok); font-weight:700; } .rv-down{ color:var(--bad); font-weight:700; }
.times{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px 16px; margin:0; }
.times dt{ font-size:13px; color:var(--muted); font-weight:600; }
.times dd{ margin:0; font-weight:600; }
.log{ list-style:none; padding:0; margin:0; display:grid; gap:6px; font-size:14px; color:var(--muted); }
.log b{ color:var(--ink); font-weight:600; }

/* Onboarding */
.role-grid{ display:grid; gap:12px; margin-top:18px; }
.role-card{ text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:14px; padding:16px 18px; display:grid; gap:2px; }
.role-card b{ font-family:var(--cond); font-size:24px; }
.role-card span{ color:var(--muted); }
.role-card:hover{ border-color:var(--brand); }

/* Settings */
.set-list{ display:grid; gap:8px; margin:10px 0; }
.set-item{ display:flex; gap:8px; align-items:center; }
.set-item .input{ min-height:44px; padding:8px 12px; font-size:16px; }
.settings{ display:grid; gap:16px; }

.toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 22px); transform:translateX(-50%); z-index:70; background:var(--ink); color:var(--surface); padding:12px 20px; border-radius:12px; font-weight:600; max-width:calc(100% - 32px); }
.toast.bad{ background:var(--bad); color:#fff; }

@media (prefers-reduced-motion: reduce){ .card.new{ animation:none; outline:4px solid var(--shop-ready); } }

/* used cars add-on (only shows when switched on for a store) */
.used-strip{ margin-top:18px; border-top:2px solid var(--shop-line); padding-top:12px; }
.used-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
@media (max-width:900px){ .used-grid{ grid-template-columns:1fr; } }
.u-list{ display:grid; gap:6px; }
.u-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:0 4px 6px; }
.u-head h3{ font-size:clamp(18px,1.5vw,28px); color:var(--shop-muted); font-weight:600; }
.u-head h3 b{ color:var(--shop-ink); font-weight:700; }
.u-head .count{ font-family:var(--cond); font-weight:700; font-size:clamp(22px,1.8vw,34px); color:var(--shop-muted); }
.u-col{ display:grid; gap:6px; align-content:start; min-width:0; }
.u-item{ display:flex; align-items:center; gap:10px; width:100%; min-width:0; text-align:left; border:0; border-left:6px solid var(--shop-line); color:inherit; background:var(--shop-card); border-radius:10px; padding:6px 12px; font-size:clamp(15px,1.2vw,22px); line-height:1.25; }
.u-item.u-warn{ border-left-color:var(--shop-warn); } .u-item.u-ok{ border-left-color:var(--shop-ok); }
.u-stock{ font-family:var(--cond); font-weight:700; color:var(--shop-muted); flex:none; }
.u-veh{ font-family:var(--cond); font-weight:700; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.u-dim{ color:var(--shop-muted); font-weight:500; }
.u-time{ font-family:var(--cond); font-weight:600; color:var(--shop-muted); flex:none; }
.u-item.u-bad{ border-left-color:var(--shop-bad); box-shadow:inset 0 0 0 2px var(--shop-bad); }
.u-t-ok{ color:var(--shop-ok); } .u-t-warn{ color:var(--shop-warn); } .u-t-bad{ color:var(--shop-bad); font-weight:700; }
.u-c-ok{ color:var(--ok); } .u-c-warn{ color:var(--warn); } .u-c-bad{ color:var(--bad); }
.u-more,.u-none{ color:var(--shop-muted); font-size:clamp(14px,1vw,18px); padding:2px 4px; }
body.tv .board.has-used{ height:100vh; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
body.tv .board.has-used .board-main{ flex:1 1 0; min-height:0; overflow:hidden; }
body.tv .board.has-used .used-strip{ flex:0 0 25vh; height:25vh; overflow:hidden; margin-top:10px; padding-top:8px; }
body.tv .u-item{ font-size:clamp(14px,2.1vh,26px); }
body.tv .u-head h3{ font-size:clamp(16px,2.4vh,30px); }
.u-who{ flex:none; color:var(--shop-muted); font-weight:600; max-width:9em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* TV with used strip on: tighter delivery cards so more fit above the strip */
body.tv .board.has-used .board-head{ margin-bottom:10px; }
body.tv .board.has-used .col-head{ padding-bottom:6px; margin-bottom:8px; }
body.tv .board.has-used .col{ gap:8px; }

<body>
<header class="top" id="top"></header>
<div id="banner"></div>
<main id="main"></main>
<div id="sheetRoot"></div>
<div id="fx"></div>

<script>
(function(){
"use strict";

/* ============================================================
   PASTE YOUR SUPABASE DETAILS HERE (Supabase > Project Settings > API)
   ============================================================ */
// Keys live in config.js so you can replace this file without re-pasting them.
const SUPABASE_URL = (window.TS_CONFIG && window.TS_CONFIG.url) || "PASTE_PROJECT_URL_HERE";
const SUPABASE_KEY = (window.TS_CONFIG && window.TS_CONFIG.key) || "PASTE_ANON_PUBLIC_KEY_HERE";
/* ============================================================ */

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("tsboard:" + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("tsboard:" + k, JSON.stringify(v)); }catch(e){} }
};
const MIN = 60000, HOUR = 3600000;
function fmtDur(ms){
  ms = Math.max(0, ms);
  const m = Math.floor(ms / MIN);
  if (m < 1) return "just now";
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60), mm = m % 60;
  if (h < 24) return h + "h" + (mm ? " " + mm + "m" : "");
  const d = Math.floor(h / 24);
  return d + "d " + (h % 24) + "h";
}
function fmtTime(t){
  if (!t) return "—";
  const d = new Date(t), now = new Date();
  const time = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  if (d.toDateString() === now.toDateString()) return time;
  const tm = new Date(now); tm.setDate(now.getDate() + 1);
  if (d.toDateString() === tm.toDateString()) return "Tomorrow " + time;
  const ys = new Date(now); ys.setDate(now.getDate() - 1);
  if (d.toDateString() === ys.toDateString()) return "Yesterday " + time;
  return d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}) + " " + time;
}
function isToday(t){ return t && new Date(t).toDateString() === new Date().toDateString(); }
function uid(){ return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }

const DEFAULT_PRODUCTS = ["Paint protection","Interior protection","Ceramic coating","Window tint","Windshield protection","Leather protection","Undercoating"];
const MAKES = ["Acura","Audi","BMW","Buick","Cadillac","Chevrolet","Chrysler","Dodge","Ford","Genesis","GMC","Honda","Hyundai","Infiniti","Jeep","Kia","Land Rover","Lexus","Lincoln","Mazda","Mercedes-Benz","Mitsubishi","Nissan","Porsche","Ram","Subaru","Tesla","Toyota","Volkswagen","Volvo"];
const STATUS = { queued:"Waiting", working:"In progress", ready:"Ready", delivered:"Delivered" };
const ROLES = {
  sales:   { label:"Sales",         desc:"Salespeople and sales managers: add, edit and track units for your store.", tabs:["add","queue","board","view"] },
  finance: { label:"Finance",       desc:"Add the protection products you sold.",            tabs:["queue","add","view"] },
  shop:    { label:"Detail shop",   desc:"The big screen and status updates for detailers.",  tabs:["board","queue"] },
  area:    { label:"Area manager",  desc:"All stores at a glance, plus setup.",               tabs:["stores","board","view","queue","add","settings"] }
};
const TAB_LABEL = { add:"Add sold unit", queue:"Queue", board:"Shop board", stores:"All stores", settings:"Setup", used:"Used cars", view:"View store" };
const FORM_VIEWS = new Set(["add","settings"]);
const perms = r => ({
  status:  ["shop","area"].includes(r),   // detail steps: shop + area manager only
  deliver: ["sales","shop","area"].includes(r),
  products:["finance","sales","area"].includes(r),
  edit:    ["sales","area"].includes(r),
  del:     ["sales","area"].includes(r),
  add:     r !== "shop"
});

/* ---------- state ---------- */
const S = {
  role: LS.get("role", null), store: LS.get("store", null), me: LS.get("me", ""),
  view: null, jobs: [], config: { stores: [], products: null, logoId: null },
  loaded: false, live: false, canWrite: true, assets: null,
  unlock: LS.get("unlock", null), lock: LS.get("lock", null),
  filter: "active", sheet: null, sound: false, tv: false,
  addDone: null, dupeOk: false, newIds: new Map()
};
if (S.role === "manager"){ S.role = "sales"; LS.set("role", "sales"); if (S.unlock && S.unlock.role === "manager"){ S.unlock.role = "sales"; LS.set("unlock", S.unlock); } }
if (!S.lock && S.unlock && S.unlock.role !== "area" && S.unlock.store){ S.lock = S.unlock.store; LS.set("lock", S.lock); }
const boot = Date.now();
const products = () => (S.config.products && S.config.products.length) ? S.config.products : DEFAULT_PRODUCTS;
const stores = () => S.config.stores || [];
const storeName = id => (stores().find(s => s.id === id) || {}).name || "Unknown store";
const byStore = (id) => S.jobs.filter(j => id === "*" || j.store === id);
const activeJobs = id => byStore(id).filter(j => j.status !== "delivered");

function urgency(j, now){
  if (j.status === "ready") return "ready";
  if (j.status === "delivered") return "";
  const left = (j.dueAt || 0) - now;
  if (left < 0) return "bad";
  if (left < 30 * MIN) return "warn";
  return "ok";
}
function dueText(j, now){
  if (!j.dueAt) return "—";
  const left = j.dueAt - now;
  if (left < 0) return -left < MIN ? "due now" : fmtDur(-left) + " late";
  return "in " + fmtDur(left);
}
function vehicle(j){ return [j.year, j.make, j.model].filter(Boolean).join(" ") || "Vehicle"; }
function sortJobs(list){ return list.slice().sort((a, b) => (a.dueAt || 0) - (b.dueAt || 0)); }

/* ---------- data layer (live db, or in-memory preview) ---------- */
let db = null;
const mem = { jobs: new Map() };
function memEmit(){ S.jobs = [...mem.jobs.entries()].map(([id, d]) => Object.assign({id}, d)).sort((a,b)=>b.createdAt-a.createdAt); render(); }
async function guard(p){
  let r;
  try{ r = await p; }catch(e){ r = { error: e }; }
  if (r && r.error){ toast("That didn't save. Check your connection and try again.", true); throw r.error; }
  return r;
}
const mine = new Set();
function upsertLocal(j){ const i = S.jobs.findIndex(x => x.id === j.id); if (i >= 0) S.jobs[i] = j; else S.jobs.unshift(j); }
const api = {
  async add(data){
    const id = (crypto.randomUUID ? crypto.randomUUID() : "j" + uid() + uid());
    if (db){ mine.add(id); await guard(db.from("jobs").insert({ id, data, created_at: data.createdAt })); upsertLocal(Object.assign({ id }, data)); render(); return id; }
    mem.jobs.set(id, Object.assign({}, data)); memEmit(); return id;
  },
  async update(id, patch){
    patch.updatedAt = Date.now();
    if (db){
      const cur = S.jobs.find(j => j.id === id) || {};
      const next = Object.assign({}, cur, patch); delete next.id;
      await guard(db.from("jobs").update({ data: next }).eq("id", id));
      upsertLocal(Object.assign({ id }, next)); render(); return;
    }
    mem.jobs.set(id, Object.assign({}, mem.jobs.get(id), patch)); memEmit();
  },
  async remove(id){
    if (db){ await guard(db.from("jobs").delete().eq("id", id)); S.jobs = S.jobs.filter(j => j.id !== id); render(); return; }
    mem.jobs.delete(id); memEmit();
  },
  async saveConfig(cfg){ S.config = cfg; if (db) await guard(db.from("config").upsert({ id: "settings", data: cfg })); render(true); }
};

/* ============================================================
   DELIVERY REVIEWS (add-on)
   Kill switch: Setup > Delivery reviews (area manager only). Stored in its own
   feature_flags table. OFF, missing, or unreachable = board works exactly as before.
   Uses its own tables only. Never writes to jobs or config.
   Every piece is wrapped so a failure here can't break the board.
   ============================================================ */
const DAY = 24 * HOUR;
const REVIEW_ISSUES = ["Missed spots","Interior","Exterior","Not ready on time","Damage"];
const R = { list: [], loaded: false, busy: false, flag: false, flagOk: false };
function rvSafe(fn){ try{ return fn() || ""; }catch(e){ console.warn("Reviews:", e); return ""; } }
// Switches (feature_flags table):
//   'reviews'          master switch, the emergency "off everywhere" button
//   'reviews:<storeId>' one per store
// No per-store rows yet = every store follows the master (how it worked before this update).
// A store added after per-store switches are in use starts OFF. Any read error = everything OFF.
R.stores = {}; R.perStore = false; R.saving = false;
function reviewsFlag(){ return R.flag === true; }
function storeSwitch(id){ return R.perStore ? R.stores[id] === true : true; }
// What you see in Setup is what's live: a store is on only if its switch AND the master are on.
function storeLive(id){ return R.flag === true && storeSwitch(id); }
function reviewsOn(store){
  if (store === "*") return stores().some(s => storeLive(s.id));
  return storeLive(store);
}
async function loadFlag(){
  try{
    if (!db){ R.flagOk = true; return; }   // preview mode: switches live in memory
    const { data, error } = await db.from("feature_flags").select("key,enabled").like("key", "reviews%");
    if (error) throw error;
    const st = {}; let master = false, per = false;
    for (const r of data){
      if (r.key === "reviews") master = !!r.enabled;
      else if (r.key.startsWith("reviews:")){ st[r.key.slice(8)] = !!r.enabled; per = true; }
    }
    R.flag = master; R.stores = st; R.perStore = per; R.flagOk = true;
  }catch(e){ R.flag = false; R.stores = {}; R.perStore = false; R.flagOk = false; }
}
async function saveFlags(rows){
  if (!db) return;
  const now = new Date().toISOString();
  const { error } = await db.from("feature_flags").upsert(rows.map(r => Object.assign({ updated_at: now }, r)));
  if (error) throw error;
}
function reviewsSwitchPanel(){
  return rvSafe(() => {
    if (S.role !== "area") return "";
    let h = '<div class="panel"><h3 style="font-size:22px">Delivery reviews</h3><p class="muted">Turn reviews on or off for each store. Off means that store’s board works exactly like before. Changes reach every device within about 30 seconds. Ratings already saved are always kept.</p>';
    if (!R.flagOk) return h + '<div class="warn-box">The reviews switches aren’t set up yet (run the reviews SQL in Supabase). Reviews stay off until they are.</div></div>';
    const dis = R.saving ? " disabled" : "";
    h += '<div class="set-list">' + stores().map(s => {
      const on = storeLive(s.id);
      return '<div class="set-item"><span style="flex:1;font-weight:600">' + esc(s.name) + '</span>' +
        '<span style="width:44px;font-weight:700;color:' + (on ? "var(--ok)" : "var(--muted)") + '">' + (on ? "ON" : "OFF") + '</span>' +
        '<button class="btn' + (on ? "" : " primary") + '" style="width:110px" data-action="rv-store-toggle" data-id="' + esc(s.id) + '"' + dis + '>' + (on ? "Turn off" : "Turn on") + '</button></div>';
    }).join("") + '</div>';
    if (reviewsOn("*")) h += '<div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn danger" data-action="rv-toggle"' + dis + '>Emergency: turn off at every store</button></div>';
    return h + '</div>';
  });
}
const reviewFor = id => R.list.find(r => r.job_id === id);
async function loadReviews(){
  if (!reviewsFlag() || !S.role || S.role === "shop" || S.role === "finance") return;
  try{
    if (db){
      const cols = S.role === "area" ? "job_id,store,score,issues,comment,salesperson,created_at" : "job_id,store,score,created_at";
      const since = new Date(Date.now() - (S.role === "area" ? 95 : 60) * DAY).toISOString();
      const { data, error } = await db.from("delivery_reviews").select(cols).gte("created_at", since).order("created_at", { ascending: false }).limit(5000);
      if (error) throw error;
      R.list = data.map(r => Object.assign({}, r, { t: new Date(r.created_at).getTime() }));
    }
    R.loaded = true;
  }catch(e){ console.warn("Reviews didn't load (board unaffected):", e); }
}
function scoreStats(store, now){
  const pick = (from, to) => R.list.filter(r => (store === "*" || r.store === store) && r.t > now - from * DAY && r.t <= now - to * DAY);
  const avg = l => l.length ? l.reduce((s, r) => s + r.score, 0) / l.length : null;
  const cur = pick(30, 0), prev = pick(60, 30);
  return { avg: avg(cur), n: cur.length, prev: avg(prev), prevN: prev.length };
}
function scoreHTML(st){
  if (!st.n) return "No ratings in the last 30 days";
  let arrow = "";
  if (st.prev != null && st.n >= 5 && st.prevN >= 5){
    const d = st.avg - st.prev;
    if (d >= 0.1) arrow = ' <span class="rv-up" title="Up from ' + st.prev.toFixed(1) + ' the 30 days before">▲</span>';
    else if (d <= -0.1) arrow = ' <span class="rv-down" title="Down from ' + st.prev.toFixed(1) + ' the 30 days before">▼</span>';
  }
  return '<b>' + st.avg.toFixed(1) + ' ★</b> (' + st.n + ' rating' + (st.n === 1 ? "" : "s") + ')' + arrow;
}
// Area manager: one line per store tile
function storeScoreLine(id){
  return rvSafe(() => reviewsOn(id) && S.role === "area" && R.loaded ? '<div class="tile-line">Delivery score, 30 days: ' + scoreHTML(scoreStats(id, Date.now())) + '</div>' : "");
}
// Area manager: all-stores total
function totalScoreTile(){
  return rvSafe(() => {
    if (!reviewsOn("*") || S.role !== "area" || !R.loaded) return "";
    const st = scoreStats("*", Date.now());
    return '<div class="total"><b>' + (st.n ? st.avg.toFixed(1) + " ★" : "—") + '</b><span>Delivery score (' + st.n + ' rating' + (st.n === 1 ? "" : "s") + ', 30 days)</span></div>';
  });
}
// Salesperson: "Rate delivery" button on delivered rows
function rateButton(j){
  return rvSafe(() => (S.role === "sales" && S.canWrite && j.status === "delivered" && reviewsOn(j.store) && R.loaded && !reviewFor(j.id) && sameSalesperson(S.me, j.salesperson))
    ? '<button class="btn primary" data-action="open" data-id="' + esc(j.id) + '" data-focus="review">Rate delivery</button>' : "");
}
// Job sheet section
function reviewSection(j){
  return rvSafe(() => {
    if (j.status !== "delivered" || !reviewsOn(j.store) || !R.loaded) return "";
    const r = reviewFor(j.id);
    if (S.role === "area"){
      if (!r) return '<div class="sec" id="rvSec"><h3>Delivery rating</h3><p class="muted" style="margin:0">Not rated yet.</p></div>';
      return '<div class="sec" id="rvSec"><h3>Delivery rating</h3><p style="margin:0"><b>' + "★".repeat(r.score) + '<span class="muted">' + "★".repeat(5 - r.score) + '</span></b> ' + r.score + ' of 5' + (r.salesperson ? ' from ' + esc(r.salesperson) : "") + '</p>' +
        (r.issues && r.issues.length ? '<div class="chips" style="margin-top:8px">' + r.issues.map(x => '<span class="pill">' + esc(x) + '</span>').join("") + '</div>' : "") +
        (r.comment ? '<p style="margin:8px 0 0">' + esc(r.comment) + '</p>' : "") + '</div>';
    }
    if (S.role !== "sales" || !S.canWrite || !sameSalesperson(S.me, j.salesperson)) return "";
    if (r) return '<div class="sec" id="rvSec"><h3>Delivery rating</h3><p class="muted" style="margin:0">Rated ' + r.score + ' of 5. Thanks!</p></div>';
    const pick = (S.sheet && S.sheet.rv) || 0;
    return '<div class="sec" id="rvSec"><h3>How was this delivery?</h3>' +
      '<div class="seg stars" role="group" aria-label="Rating, 1 to 5 stars">' + [1,2,3,4,5].map(n => '<button type="button" data-action="rv-star" data-n="' + n + '" aria-pressed="' + (n === pick) + '" aria-label="' + n + ' star' + (n > 1 ? "s" : "") + '">' + n + ' ★</button>').join("") + '</div>' +
      '<p class="muted" style="margin:12px 0 6px">Anything off? (optional)</p><div class="chips" data-form="rv-issues">' + REVIEW_ISSUES.map(x => '<label class="chip-opt"><input type="checkbox" value="' + esc(x) + '"><span>' + esc(x) + '</span></label>').join("") + '</div>' +
      '<label class="field" style="margin-top:12px"><span>Comment (optional)</span><textarea class="input" id="rvComment" maxlength="500"></textarea></label>' +
      '<div class="row" style="margin-top:12px"><button class="btn primary" data-action="rv-save">Submit rating</button><button class="btn" data-action="rv-skip">Skip / not mine</button></div><div id="rvErr"></div></div>';
  });
}
// Who is this delivery for? Forgiving name match: same first name (ignoring case,
// punctuation, extra spaces). Last initial only used when both names have one.
function nameParts(n){ return String(n || "").toLowerCase().replace(/[^a-z\s]/g, "").trim().split(/\s+/).filter(Boolean); }
function sameSalesperson(a, b){
  const x = nameParts(a), y = nameParts(b);
  if (!x.length || !y.length || x[0] !== y[0]) return false;
  if (x.length > 1 && y.length > 1 && x[x.length - 1][0] !== y[y.length - 1][0]) return false;
  return true;
}
// Don't interrupt someone halfway through adding a unit.
function addFormInUse(){
  if (S.view !== "add" || S.addDone) return false;
  const f = document.querySelector('[data-form="add"]'); if (!f) return false;
  return ["stock","year","make","model","color","notes"].some(k => f[k] && String(f[k].value || "").trim()) || !!f.querySelector('input[name="prod"]:checked');
}
const rvPopped = new Set();   // popped once per visit; unrated ones come back next visit
const rvSkipped = () => LS.get("rvSkip", []);
function isMyDelivery(j){
  return S.role === "sales" && j.status === "delivered" && (Date.now() - (j.deliveredAt || 0)) < 48 * HOUR && sameSalesperson(S.me, j.salesperson);
}
function myPendingRatings(){
  const skip = rvSkipped();
  return S.jobs.filter(j => isMyDelivery(j) && reviewsOn(j.store) && !reviewFor(j.id) && !skip.includes(j.id)).sort((a, b) => (b.deliveredAt || 0) - (a.deliveredAt || 0));
}
// Pop the rating up on the salesperson's own phone/desktop, whoever marked it Delivered.
setInterval(() => { rvSafe(() => {
  if (!reviewsFlag() || !R.loaded || S.role !== "sales" || !S.canWrite || S.sheet || document.hidden || !unlocked() || addFormInUse()) return;
  const j = myPendingRatings().find(x => !rvPopped.has(x.id)); if (!j) return;
  rvPopped.add(j.id); openSheet(j.id, "review");
}); }, 5000);
// After a salesperson marks Delivered, bring up the rating prompt
function promptReview(id){
  try{
    const j = S.jobs.find(x => x.id === id);
    if (!j || !isMyDelivery(j) || !reviewsOn(j.store) || !R.loaded || reviewFor(id) || rvSkipped().includes(id)) return;
    rvPopped.add(id);
    if (S.sheet && S.sheet.id === id){ S.sheet.focus = "review"; S.sheet.focused = false; S.sheet.rendered = false; renderSheet(); }
    else openSheet(id, "review");
  }catch(e){ console.warn("Reviews:", e); }
}
document.addEventListener("click", async e => {
  const t = e.target.closest('[data-action="rv-star"],[data-action="rv-save"],[data-action="rv-toggle"],[data-action="rv-store-toggle"],[data-action="rv-skip"]'); if (!t) return;
  if (t.dataset.action === "rv-skip"){
    if (S.sheet){ LS.set("rvSkip", rvSkipped().concat([S.sheet.id]).slice(-300)); closeSheet(); toast("Skipped"); render(true); }
    return;
  }
  if (t.dataset.action === "rv-toggle" || t.dataset.action === "rv-store-toggle"){
    if (S.role !== "area" || R.saving) return;
    R.saving = true; t.disabled = true;
    try{
      let rows, msg;
      if (t.dataset.action === "rv-toggle"){   // emergency: everything off
        rows = [{ key: "reviews", enabled: false }].concat(stores().map(s => ({ key: "reviews:" + s.id, enabled: false })));
        msg = "Reviews turned off at every store";
      } else {
        const id = t.dataset.id, next = !storeLive(id);
        // Write every store exactly as it shows now, then change just this one.
        rows = stores().map(s => ({ key: "reviews:" + s.id, enabled: s.id === id ? next : storeLive(s.id) }));
        if (next) rows.push({ key: "reviews", enabled: true });
        msg = "Reviews " + (next ? "on" : "off") + " at " + storeName(id);
      }
      await saveFlags(rows);   // one save: all of it happens or none of it does
      rows.forEach(r => { if (r.key === "reviews") R.flag = r.enabled; else R.stores[r.key.slice(8)] = r.enabled; });
      R.perStore = true;
      if (R.flag) await loadReviews();
      toast(msg);
    }catch(err){ console.warn("Reviews:", err); toast("Couldn't change the switch. Nothing was changed. Try again.", true); }
    R.saving = false; render(true); return;
  }
  if (t.dataset.action === "rv-skip"){
    if (S.sheet){ LS.set("rvSkip", rvSkipped().concat([S.sheet.id]).slice(-300)); closeSheet(); toast("Skipped"); render(true); }
    return;
  }
  if (t.dataset.action === "rv-toggle" || t.dataset.action === "rv-store-toggle"){
    if (S.role !== "area" || R.saving) return;
    R.saving = true; t.disabled = true;
    try{
      if (t.dataset.action === "rv-toggle"){
        const next = !R.flag;
        await saveFlags([{ key: "reviews", enabled: next }]);
        R.flag = next;
        toast(next ? "Reviews resumed" : "Reviews turned off at every store");
      } else {
        const id = t.dataset.id, next = !storeSwitch(id);
        // First per-store change: write every store's current state so nothing else changes.
        const rows = R.perStore ? [] : stores().map(s => ({ key: "reviews:" + s.id, enabled: storeSwitch(s.id) }));
        rows.push({ key: "reviews:" + id, enabled: next });
        // Turning a store on while the system is off also resumes the system for that store.
        if (next && !R.flag) rows.push({ key: "reviews", enabled: true });
        await saveFlags(rows);
        rows.forEach(r => { if (r.key === "reviews") R.flag = r.enabled; else R.stores[r.key.slice(8)] = r.enabled; });
        R.perStore = true;
        toast("Reviews " + (next ? "on" : "off") + " at " + storeName(id));
      }
      if (R.flag) await loadReviews();
    }catch(err){ console.warn("Reviews:", err); toast("Couldn't change the switch. Nothing was changed. Try again.", true); }
    R.saving = false; render(true); return;
  }
  if (t.dataset.action === "rv-skip"){
    if (S.sheet){ LS.set("rvSkip", rvSkipped().concat([S.sheet.id]).slice(-300)); closeSheet(); toast("Skipped"); render(true); }
    return;
  }
  if (t.dataset.action === "rv-toggle"){
    if (S.role !== "area") return;
    const next = !R.flag; t.disabled = true;
    try{
      if (db){
        const { error } = await db.from("feature_flags").upsert({ key: "reviews", enabled: next, updated_at: new Date().toISOString() });
        if (error) throw error;
      }
      R.flag = next; if (next) await loadReviews();

/* ============================================================
   USED CARS (add-on)
   Bottom 1/4 of the shop TV + a "Used cars" tab for sales, shop and area manager.
   Switch: Setup > Used cars, one per store (feature_flags 'used:<storeId>').
   OFF, missing, or unreachable = board works exactly as before.
   Uses its own table (used_units) only. Never writes to jobs or config.
   Done cars are kept 90 days, then cleared.
   Every piece is wrapped so a failure here can't break the board.
   ============================================================ */
const USED_STAGES = { detail:"In detail", progress:"In progress", done:"Detail & photos done" };
const USED_PILL = { detail:"queued", progress:"working", done:"delivered" };
const USED_GOAL = 24 * HOUR, USED_MAX = 48 * HOUR;   // timer: 24h expected, 48h absolute max
const USED_SET = "_settings";                           // detailer lists live in used_units under this store id
const BARCODE_LIB = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
const USED_NEXT = { detail:{ to:"progress", label:"Start" }, progress:{ to:"done", label:"Detail & photos done" } };
const USED_KEEP = 90 * DAY;
const U = { list: [], detailers: {}, loaded: false, flags: {}, flagOk: false, everOk: false, saving: false, busy: false, filter: "open", modal: null, sig: null, wasOn: false, chan: null, lastPurge: 0, running: false };
const memUsed = new Map();
function uSafe(fn, d){ try{ const v = fn(); return v == null ? d : v; }catch(e){ console.warn("Used cars:", e); return d; } }
function usedOn(store){
  if (!U.flagOk) return false;
  if (store === "*") return stores().some(s => U.flags[s.id] === true);
  return U.flags[store] === true;
}
const usedPerm = r => ({ add: ["sales","shop","area"].includes(r), move: ["shop","area"].includes(r), del: ["sales","shop","area"].includes(r) });
function usedTab(){ return uSafe(() => !!S.role && usedPerm(S.role).add && !!S.store && usedOn(S.store), false); }
function tabsFor(role){ const t = ROLES[role].tabs; return usedTab() ? t.concat(["used"]) : t; }
const usedKeep = u => u.stage !== "done" || (u.doneAt || 0) > Date.now() - USED_KEEP;
const usedFor = id => U.list.filter(u => (id === "*" ? usedOn(u.store) : u.store === id) && usedKeep(u));
const usedVeh = u => [u.year, u.make, u.model].filter(Boolean).join(" ") || "Used vehicle";
const usedId = u => u.stock ? "#" + u.stock : (u.vin ? "VIN " + u.vin.slice(-8) : "");
// Timer runs from when the car is added until Detail & photos done. Green under 24h, yellow 24–48h, red past 48h.
function usedClock(u, now){
  const end = u.stage === "done" ? (u.doneAt || now) : now, age = Math.max(0, end - (u.createdAt || end));
  const lvl = age < USED_GOAL ? "ok" : age < USED_MAX ? "warn" : "bad";
  let txt;
  if (u.stage === "done") txt = "took " + fmtDur(age);
  else if (age < USED_GOAL) txt = fmtDur(USED_GOAL - age) + " left";
  else if (age < USED_MAX) txt = fmtDur(USED_MAX - age) + " to 48h";
  else txt = fmtDur(age - USED_MAX) + " past 48h";
  // short version for the TV strip: whole hours once it's 2h+, so names get the room
  const sd = ms => ms >= 2 * HOUR ? Math.round(ms / HOUR) + "h" : fmtDur(ms);
  const short = u.stage === "done" ? "took " + sd(age) : age < USED_GOAL ? sd(USED_GOAL - age) + " left" : age < USED_MAX ? sd(USED_MAX - age) + " to 48h" : sd(age - USED_MAX) + " late";
  return { lvl, txt, age, short };
}

function usedLog(u, a){ return (u.log || []).concat([{ t: Date.now(), by: S.me || ROLES[S.role].label, a }]).slice(-30); }

async function usedLoadFlags(){
  try{
    if (!db){ U.flagOk = true; return; }   // preview mode: switches live in memory
    const { data, error } = await db.from("feature_flags").select("key,enabled").like("key", "used:%");
    if (error) throw error;

    U.flags = f; U.flagOk = true; U.everOk = true;
  }catch(e){

}
async function usedLoad(){
  if (!db){ U.list = [...memUsed.values()].map(u => Object.assign({}, u)); U.loaded = true; return; }   // preview: detailers stay in U.detailers
  const { data, error } = await db.from("used_units").select("id,store,data").order("created_at", { ascending: false }).limit(6000);
  if (error) throw error;
  const det = {};
  U.list = data.filter(r => { if (r.store !== USED_SET) return true; if (r.id.startsWith("detailers:")) det[r.id.slice(10)] = (r.data && r.data.names) || []; else if (r.id === "models") U.models = (r.data && r.data.models) || {}; return false; })
    .map(r => Object.assign({}, r.data, { id: r.id, store: r.store }));
  U.detailers = det;
  U.loaded = true;
  usedPurge();
}
// Clear done cars older than 90 days (shop TV or area manager does it, at most once an hour).
async function usedPurge(){
  try{
    if (!db || !["shop","area"].includes(S.role) || Date.now() - U.lastPurge < HOUR) return;
    U.lastPurge = Date.now();
    const old = U.list.filter(u => !usedKeep(u)).map(u => u.id).slice(0, 200);
    if (!old.length) return;
    const { error } = await db.from("used_units").delete().in("id", old);
    if (!error) U.list = U.list.filter(u => !old.includes(u.id));
  }catch(e){}
}
const usedApi = {
  async add(store, d){
    const id = crypto.randomUUID ? crypto.randomUUID() : "u" + uid() + uid();
    if (db){ const { error } = await db.from("used_units").insert({ id, store, data: d, created_at: new Date(d.createdAt).toISOString() }); if (error) throw error; }
    else memUsed.set(id, Object.assign({}, d, { id, store }));
    U.list.unshift(Object.assign({}, d, { id, store }));
  },
  async update(u, patch){
    const next = Object.assign({}, u, patch, { updatedAt: Date.now() }); delete next.id; delete next.store;
    if (db){ const { error } = await db.from("used_units").update({ data: next, updated_at: new Date().toISOString() }).eq("id", u.id); if (error) throw error; }
    else memUsed.set(u.id, Object.assign({}, next, { id: u.id, store: u.store }));
    const i = U.list.findIndex(x => x.id === u.id), row = Object.assign({}, next, { id: u.id, store: u.store });
    if (i >= 0) U.list[i] = row;
    return row;
  },
  async remove(u){
    if (db){ const { error } = await db.from("used_units").delete().eq("id", u.id); if (error) throw error; }
    else memUsed.delete(u.id);
    U.list = U.list.filter(x => x.id !== u.id);
  }
};

// The video is shown "cover"-style, so map the on-screen box back to camera pixels.
function scanCrop(v){
  try{
    const box = document.querySelector("#scanRoot .scan-box").getBoundingClientRect(), vr = v.getBoundingClientRect();
    const vw = v.videoWidth, vh = v.videoHeight, sc = Math.max(vr.width / vw, vr.height / vh);
    const ox = (vr.width - vw * sc) / 2 + vr.left, oy = (vr.height - vh * sc) / 2 + vr.top;
    const mx = box.width * 0.08, my = box.height * 0.15;
    let x = (box.left - mx - ox) / sc / vw, y = (box.top - my - oy) / sc / vh, w = (box.width + 2 * mx) / sc / vw, h = (box.height + 2 * my) / sc / vh;
    x = Math.max(0, x); y = Math.max(0, y); w = Math.min(1 - x, w); h = Math.min(1 - y, h);
    return w > 0.05 && h > 0.05 ? [x, y, w, h] : [0, 0, 1, 1];
  }catch(e){ return [0, 0, 1, 1]; }
}
// One attempt per frame. The ZXing reader cycles through a few tilts, since door-jamb labels are rarely level.
const SCAN_TILTS = [0, -6, 6, 90, -12, 12, 0, 84, 96];
async function scanLoop(v){
  if (!SC.stream) return;
  let vin = null;
  try{
    if (v.readyState >= 2 && v.videoWidth){
      vin = await vinNative(v);
      if (!vin && window.ZXing){
        const k = SC.n++ % SCAN_TILTS.length, deg = SCAN_TILTS[k];
        const c = scanCrop(v);   // what's inside the box on screen (plus a margin)...
        const crop = SC.n % 2 ? c : [0, c[1], 1, c[3]];   // ...and every other frame the full width of that band
        vin = vinTry(window.ZXing, v, v.videoWidth, v.videoHeight, crop, 1920, deg, k === 6);
      }
    }
  }catch(e){}
  if (!SC.stream) return;
  if (vin){
    try{ navigator.vibrate && navigator.vibrate(120); }catch(e){}
    scanBeep();
    const form = SC.form; scanStop();
    if (form && form.isConnected) usedGotVin(form, vin);
    return;
  }
  if (SC.n === 60) scanUI("Still looking… move closer or farther, turn on the light, or tap Type it in.", true);
  SC.timer = setTimeout(() => scanLoop(v), 60);
}

}

let audio = null;
function chime(){
  if (!S.sound || !audio) return;
  try{
    const t = audio.currentTime;
    [[880,0],[1175,.18],[1568,.36]].forEach(([f, d]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.35, t + d + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + .5);
      o.connect(g).connect(audio.destination); o.start(t + d); o.stop(t + d + .55);
    });
  }catch(e){}
}

/* TV can't be scrolled or tapped, so every car stays on screen:
   1) shrink the whole area evenly until the fullest column fits (down to a readable minimum),
   2) if a column still doesn't fit, it flips through pages by itself every few seconds. */
const TV_PAGE_MS = 8000;
function fitArea(wrap, avail, minZ){
  if (!wrap || avail < 40) return;
  const cols = [...wrap.children];
  const list = c => c.querySelector(".col, .u-list");
  wrap.style.transform = ""; wrap.style.width = ""; wrap.style.transformOrigin = "0 0";
  cols.forEach(c => { c.style.position = "relative"; const l = list(c); if (l){ l.style.height = ""; l.style.overflow = ""; l.style.position = "relative"; l.scrollTop = 0; } const p = c.querySelector(".tv-page"); if (p) p.remove(); });
  const need = () => Math.max(...cols.map(c => c.offsetHeight));
  let z = 1;
  for (z = 1; z > minZ; z = Math.round((z - 0.04) * 100) / 100){
    wrap.style.width = (100 / z) + "%"; wrap.style.transform = z < 1 ? "scale(" + z + ")" : "";
    if (need() * z <= avail) break;
  }
  if (z <= minZ){ z = minZ; wrap.style.width = (100 / z) + "%"; wrap.style.transform = "scale(" + z + ")"; }
  const room = avail / z;
  cols.forEach(c => {
    const l = list(c); if (!l || c.offsetHeight <= room) return;
    const vis = room - l.offsetTop;   // l is inside c; c's top is the column top
    if (vis < 40) return;
    // page breaks fall between cards, never through one
    const starts = [0], ends = []; let start = 0, end = 0;
    [...l.children].forEach(el => { const t = el.offsetTop, b = t + el.offsetHeight; if (b - start > vis && t > start){ ends.push(end); start = t; starts.push(t); } end = b; });
    ends.push(end);
    const pg = Math.floor(Date.now() / TV_PAGE_MS) % starts.length;
    // the list shows exactly this page's cards: it ends at the last whole card, never mid-card
    l.style.overflow = "hidden"; l.style.height = (ends[pg] - starts[pg]) + "px"; l.scrollTop = starts[pg];
    const head = c.querySelector(".col-head, .u-head");
    if (head){ const tag = document.createElement("span"); tag.className = "tv-page"; tag.textContent = "Page " + (pg + 1) + " of " + starts.length; head.querySelector("h3").after(tag); }
  });
}
function fitTV(){
  try{
    if (!S.tv || S.view !== "board") return;
    const vh = window.innerHeight;
    const cols = document.querySelector("#main .board-cols"), main = document.querySelector("#main .board-main");
    if (cols){
      cols.style.transform = ""; cols.style.width = "";
      const bottom = Math.min(vh, main ? main.getBoundingClientRect().bottom : vh) - 6;
      fitArea(cols, bottom - cols.getBoundingClientRect().top, 0.75);
    }
    const grid = document.querySelector("#main .used-grid");
    if (grid){
      const strip = grid.parentElement; grid.style.transform = ""; grid.style.width = "";
      const sb = Math.min(vh, strip.getBoundingClientRect().bottom) - 4;
      fitArea(grid, sb - grid.getBoundingClientRect().top, 0.75);
    }
  }catch(e){ console.warn("TV fit:", e); }
}

function duePresets(){
  const now = new Date(), list = [["60","1 hour"],["120","2 hours"],["240","4 hours"]];
  if (now.getHours() < 16 && new Date(now).setHours(17,0,0,0) - now >= HOUR) list.push(["eod","Today 5 PM"]);
  list.push(["tom","Tomorrow 9 AM"], ["custom","Pick a time"]);
  return list;
}
function dueFromPreset(p, custom){
  const now = new Date();
  if (p === "eod"){ const d = new Date(now); d.setHours(17,0,0,0); return d.getTime(); }
  if (p === "tom"){ const d = new Date(now); d.setDate(d.getDate()+1); d.setHours(9,0,0,0); return d.getTime(); }
  if (p === "custom"){ const t = custom ? new Date(custom).getTime() : NaN; return isNaN(t) ? null : t; }
  return Date.now() + Number(p) * MIN;
}

const VS_SECTIONS = [["ticker","Ticker"],["kpis","Scoreboard"],["now","Live board"],["today","Delivered today"],["week","Last 7 days"],["month","Last 30 days"],["ontime","On-time & speed (30/60/90 days)"],["products","Products"],["used","Used cars"],["rank","Salesperson ranking"]];
// Layout is set per store by the area manager (feature_flags 'view:<storeId>:<section>'). Everyone else just sees it.
const VSF = { flags: {}, sig: "" };
function vsPrefs(store){

async function vsLoad(){

    const { data, error } = await db.from("feature_flags").select("key,enabled").like("key", "view:%");

  const ids = target === "__all" ? stores().map(x => x.id) : [target];
  if (!ids.length) return;
  const now = new Date().toISOString();
  if (db){ const rows = []; ids.forEach(id => Object.entries(changes).forEach(([k, on]) => rows.push({ key: "view:" + id + ":" + k, enabled: on, updated_at: now })));
    const { error } = await db.from("feature_flags").upsert(rows); if (error) throw error; }
  ids.forEach(id => { VSF.flags[id] = Object.assign({}, VSF.flags[id] || {}, changes); });
  VSF.sig = JSON.stringify(VSF.flags);
}

/* 90 days of history for View store averages: loaded only when someone opens it, refreshed every 5 minutes. */
const VH = { key: "", at: 0, jobs: [], busy: false };
async function vsHistory(){
  const key = S.store || "*";
  if (!db || VH.busy || (VH.key === key && Date.now() - VH.at < 5 * MIN)) return;
  VH.busy = true;
  try{
    let q = db.from("jobs").select("id,data").gte("created_at", new Date(Date.now() - 95 * DAY).toISOString()).order("created_at", { ascending: false }).limit(6000);
    if (key !== "*") q = q.eq("data->>store", key);
    const { data, error } = await q; if (error) throw error;
    VH.jobs = data.map(r => Object.assign({ id: r.id }, r.data)); VH.key = key; VH.at = Date.now();
    if (S.view === "view") renderMain();
  }catch(e){ console.warn("View store history:", e); VH.at = Date.now(); VH.key = key; }

}

  const stLbl = { queued:"WAITING", working:"IN PROG", ready:"READY" };

  h += row("rA", [
    v.now ? tile("Live board", '<span class="tm-sub">' + num("t-open", "In the shop", rows, open.length + " in shop") + '</span>', rows.length ? '<table class="tm-t tm-live-t"><thead><tr><th>Stock</th><th>Vehicle</th><th>Sales</th><th>Status</th><th class="r">Due</th><th class="r">Clock</th></tr></thead><tbody>' + rows.map(j => { const u = urgency(j, now);
      return '<tr class="u-' + u + ' tm-click" ' + vsReg("j-" + j.id, "#" + j.stock + " " + vehicle(j), [j]) + '><td class="mono">' + esc(j.stock) + '</td><td>' + veh(j) + (j.color ? ' <span class="dim">' + esc(j.color) + '</span>' : "") + (j.waiting ? ' <span class="tm-tag">WAITING CUST</span>' : "") + (multi ? ' <span class="dim">· ' + esc(storeName(j.store)) + '</span>' : "") + '</td><td>' + esc(j.salesperson || "—") + '</td><td><span class="tm-st ' + j.status + '">' + stLbl[j.status] + '</span></td><td class="r mono">' + esc(j.dueAt ? tm(j.dueAt) : "—") + '</td><td class="r mono c-' + u + '">' + esc(j.status === "ready" ? "ready " + fmtDur(now - (j.readyAt || now)) : dueText(j, now)) + '</td></tr>'; }).join("") + '</tbody></table>'
      : '<div class="tm-empty">No cars in the shop right now.</div>') : "",
    v.today ? tile("Delivered today", '<span class="tm-sub">' + num("t-today", "Delivered today", today, today.length) + '</span>', today.length ? '<table class="tm-t tm-del-t"><thead><tr><th>Time</th><th>Stock</th><th>Vehicle</th><th>Sales</th><th class="r">Prod</th></tr></thead><tbody>' + today.map(j =>
      '<tr class="tm-click" ' + vsReg("j-" + j.id, "#" + j.stock + " " + vehicle(j), [j]) + '><td class="mono">' + esc(tm(j.deliveredAt)) + '</td><td class="mono">' + esc(j.stock) + '</td><td>' + veh(j) + (multi ? ' <span class="dim">· ' + esc(storeName(j.store)) + '</span>' : "") + '</td><td>' + esc(j.salesperson || "—") + '</td><td class="r mono">' + ((j.products || []).length || "—") + '</td></tr>').join("") + '</tbody></table>'
      : '<div class="tm-empty">No deliveries yet today.</div>') : ""
  ]);

  // charts: last 7 days and last 30 days, one bar per day
  const dayList = n => [...Array(n)].map((_, i) => { const a = T0 - (n - 1 - i) * DAY, it = byNew(inRange(a, a + DAY)), dt = new Date(a);
    return { items: it, n: it.length, cur: a === T0, l: n <= 7 ? dt.toLocaleDateString([], { weekday:"short" }) : ((n - 1 - i) % 5 === 0 ? dt.toLocaleDateString([], { month:"numeric", day:"numeric" }) : ""), t: "Delivered " + dt.toLocaleDateString([], { weekday:"long", month:"short", day:"numeric" }) }; });
  const bars = (pfx, list, thin) => { const mx = Math.max(1, ...list.map(d => d.n)); return '<div class="tm-bars' + (thin ? " thin" : "") + '">' + list.map((d, i) => '<div class="' + (d.cur ? "cur" : "") + (d.n ? " tm-click" : "") + '"' + (d.n ? " " + vsReg(pfx + i, d.t, d.items) : "") + ' title="' + esc(d.t + ": " + d.n) + '"><b>' + (thin ? "" : d.n) + '</b><i style="height:' + Math.max(d.n ? 6 : 2, Math.round(d.n / mx * 100)) + '%"></i><span>' + d.l + '</span></div>').join("") + '</div>'; };
  const w30 = W[0];
  const gauge = (p0, items) => { const p = p0 == null ? 0 : p0, c = p0 == null ? "var(--shop-line)" : p >= 90 ? "var(--shop-ok)" : p >= 75 ? "var(--shop-warn)" : "var(--shop-bad)";
    return '<div class="tm-gauge tm-click" style="--p:' + p + ';--c:' + c + '" ' + vsReg("g-ot", "Ready on time? (30 days)", items) + '><b>' + pct(p0) + '</b><small>30 days</small></div>'; };
  const cellN = (key, ttl, items, txt) => items.length ? '<td class="r mono"><span class="tm-n" ' + vsReg(key, ttl, items) + '>' + txt + '</span></td>' : '<td class="r mono dim">' + txt + '</td>';
  const pc = {}, pcars = {}; d30.forEach(j => (j.products || []).forEach(p => { pc[p] = (pc[p] || 0) + 1; (pcars[p] = pcars[p] || []).push(j); }));
  const top = Object.entries(pc).sort((a, b) => b[1] - a[1]).slice(0, 6);
  h += row("rB", [
    v.week ? tile("Last 7 days", '<span class="tm-sub">' + num("t-7", "Delivered, last 7 days", d7, d7.length) + ' · ' + (d7.length / 7).toFixed(1) + '/day</span>', bars("d7_", dayList(7))) : "",
    v.month ? tile("Last 30 days", '<span class="tm-sub">' + num("t-30", "Delivered, last 30 days", d30, d30.length) + ' · ' + (d30.length / 30).toFixed(1) + '/day</span>', bars("d30_", dayList(30), true)) : "",
    v.ontime ? tile("On-time & speed", '<span class="tm-sub dim">rolling averages</span>', '<div class="tm-ot">' + gauge(w30.ot, w30.fin) + '<div><span>Ready on time</span><small>' + num("t-fin30", "Ready in the last 30 days", w30.fin, w30.fin.length + " cars") + ' · today ' + (finToday.length ? num("t-ott", "Ready today", finToday, pct(onTime(finToday))) : "—") + '</small></div></div>' +
      '<table class="tm-t tm-avg"><thead><tr><th></th><th class="r">30 days</th><th class="r">60 days</th><th class="r">90 days</th></tr></thead><tbody>' +
      '<tr><td>Ready on time</td>' + W.map(x => cellN("ot" + x.d, "Ready on time? (" + x.d + " days)", x.fin, pct(x.ot))).join("") + '</tr>' +
      '<tr><td>Sold → ready</td>' + W.map(x => cellN("tn" + x.d, "Sold → ready (" + x.d + " days)", x.fin, dur(x.turn))).join("") + '</tr>' +
      '<tr><td>Deliveries / day</td>' + W.map(x => cellN("pd" + x.d, "Delivered, last " + x.d + " days", x.del, x.perDay.toFixed(1))).join("") + '</tr></tbody></table>' +
      (haveDays < 90 ? '<p class="tm-foot">The board has ' + haveDays + ' day' + (haveDays === 1 ? "" : "s") + ' of history so far, so the longer averages fill in over time.</p>' : "")) : "",
    v.products ? tile("Products · last 30 days", '<span class="tm-sub">' + prodN(d30) + ' sold</span>', top.length ? '<div class="tm-prods">' + top.map(([p, n], i) => '<div class="tm-click" ' + vsReg("p" + i, p + " (last 30 days)", pcars[p]) + '><span>' + esc(p) + '</span><b class="mono">' + n + ' <em>' + Math.round(n / d30.length * 100) + '% of cars</em></b><i style="width:' + Math.round(n / top[0][1] * 100) + '%"></i></div>').join("") + '</div>'
      : '<div class="tm-empty">No products recorded in the last 30 days.</div>') : ""
  ]);

  let tUsed = "", tRank = "";
  if (useOn) tUsed = tile("Used cars in detail", '<span class="tm-sub">' + num("t-uo", "Used cars in detail", uo, uo.length + " in", "used") + ' · ' + num("t-ud", "Used cars done, last 30 days", uDone30, uDone30.length + " done 30d", "used") + ' · avg ' + esc(dur(uAvg)) + '</span>',
    uo.length ? '<table class="tm-t tm-used-t"><thead><tr><th>Stock</th><th>VIN</th><th>Vehicle</th><th>Stage</th><th>Detailer</th><th class="r">Time in detail</th></tr></thead><tbody>' + uo.map(u => { const c = usedClock(u, now), l = c.lvl === "ok" ? "ok" : c.lvl === "warn" ? "warn" : "bad";
      return '<tr class="u-' + l + ' tm-click" ' + vsReg("u-" + u.id, "#" + (u.stock || "") + " " + usedVeh(u), [u], "used") + '><td class="mono">' + esc(u.stock || "—") + '</td><td class="mono dim">' + esc(u.vin ? String(u.vin).slice(-8) : "—") + '</td><td>' + esc(usedVeh(u)) + (u.color ? ' <span class="dim">' + esc(u.color) + '</span>' : "") + (multi ? ' <span class="dim">· ' + esc(storeName(u.store)) + '</span>' : "") + '</td><td><span class="tm-st ' + (u.stage === "detail" ? "queued" : "working") + '">' + (u.stage === "detail" ? "IN DETAIL" : "IN PROG") + '</span></td><td>' + esc(u.detailer || "—") + '</td><td class="r mono c-' + l + '"><b>' + esc(fmtDur(c.age)) + '</b> <span class="dim">' + esc(c.short) + '</span></td></tr>'; }).join("") + '</tbody></table>'
      : '<div class="tm-empty">No used cars in detail right now.</div>') ;
  if (useOn) tUsed = tUsed.replace('</div></section>', '<table class="tm-t tm-avg"><thead><tr><th>Finished used cars</th><th class="r">30 days</th><th class="r">60 days</th><th class="r">90 days</th></tr></thead><tbody>' +
      '<tr><td>Cars done</td>' + UW.map(x => x.l.length ? '<td class="r mono"><span class="tm-n" ' + vsReg("ud" + x.d, "Used cars done, last " + x.d + " days", x.l, "used") + '>' + x.l.length + '</span></td>' : '<td class="r mono dim">0</td>').join("") + '</tr>' +
      '<tr><td>Avg time in detail</td>' + UW.map(x => '<td class="r mono">' + esc(dur(x.avg)) + '</td>').join("") + '</tr>' +
      '<tr><td>Done within 24h</td>' + UW.map(x => '<td class="r mono">' + pct(x.in24) + '</td>').join("") + '</tr>' +
      '<tr><td>Took over 48h</td>' + UW.map(x => x.over48.length ? '<td class="r mono c-bad"><span class="tm-n" ' + vsReg("uo" + x.d, "Used cars over 48h, last " + x.d + " days", x.over48, "used") + '>' + x.over48.length + '</span></td>' : '<td class="r mono dim">0</td>').join("") + '</tr></tbody></table></div></section>');
  if (v.rank){
    const d90 = last(90), t = {};
    const add = (l, key) => l.forEach(j => { const n = (j.salesperson || "Unknown").trim(); t[n] = t[n] || { d: [], w: [], m: [], q: [], p: 0 }; t[n][key].push(j); if (key === "m") t[n].p += (j.products || []).length; });
    add(today, "d"); add(d7, "w"); add(d30, "m"); add(d90, "q");
    const rk = Object.entries(t).filter(([, r]) => r.m.length || r.d.length || r.w.length).sort((a, b) => b[1].m.length - a[1].m.length || b[1].q.length - a[1].q.length || a[0].localeCompare(b[0]));
    const mx = rk.length ? rk[0][1].m.length || 1 : 1;
    const c = (key, ttl, l) => '<td class="r mono">' + (l.length ? '<span class="tm-n" ' + vsReg(key, ttl, l) + '>' + l.length + '</span>' : "0") + '</td>';
    tRank = tile("Salesperson ranking", '<span class="tm-sub">by last 30 days</span>', rk.length ? '<table class="tm-t tm-rank"><thead><tr><th>#</th><th>Salesperson</th><th></th><th class="r">Today</th><th class="r">7d</th><th class="r">30d</th><th class="r">90d</th><th class="r">Prod/car</th></tr></thead><tbody>' + rk.map(([n, r], i) =>
      '<tr><td><span class="tm-pl p' + (i + 1) + '">' + (i + 1) + '</span></td><td><b>' + esc(n) + '</b></td><td class="tm-meter"><i style="width:' + Math.round(r.m.length / mx * 100) + '%"></i></td>' + c("r" + i + "d", n + " · today", r.d) + c("r" + i + "w", n + " · last 7 days", r.w) + c("r" + i + "m", n + " · last 30 days", r.m) + c("r" + i + "q", n + " · last 90 days", r.q) + '<td class="r mono">' + (r.m.length ? (r.p / r.m.length).toFixed(1) : "—") + '</td></tr>').join("") + '</tbody></table>'
      : '<div class="tm-empty">No deliveries in the last 30 days.</div>');
  }
  h += row("rC", [tUsed, tRank]);
  if (area) h += rvSafe(() => vsReviewsTile(now, multi));
  return h + '</div>';
}

/* --- Shop board --- */
function viewBoard(){
  const now = Date.now(), all = activeJobs(S.store);
  const cols = [["queued","Waiting"],["working","In progress"],["ready","Ready for delivery"]];
  const over = all.filter(j => urgency(j, now) === "bad").length;
  const title = S.store === "*" ? "All stores" : storeName(S.store);
  const card = j => {
    const u = urgency(j, now), dueCls = u === "bad" ? "due-bad" : u === "warn" ? "due-warn" : "due-ok";
    return '<button class="card u-' + u + (S.newIds.has(j.id) ? " new" : "") + '" data-action="open" data-id="' + esc(j.id) + '">' +
      '<div class="card-top"><span class="stock">#' + esc(j.stock) + '</span>' +
      (S.store === "*" ? '<span class="store-tag">' + esc(storeName(j.store)) + '</span>' : "") +
      (j.rush ? '<span class="flag rush">Rush</span>' : "") + (j.waiting ? '<span class="flag wait">Customer waiting</span>' : "") + '</div>' +
      '<div class="veh">' + esc(vehicle(j)) + '</div>' + (j.color ? '<div class="vcolor">' + esc(j.color) + '</div>' : "") +
      '<dl class="card-stats"><div><dt>Salesperson</dt><dd>' + esc(j.salesperson || "—") + '</dd></div>' +
      (j.status === "ready" ? '<div><dt>Ready for</dt><dd>' + esc(fmtDur(now - (j.readyAt || now))) + '</dd></div>'
        : '<div><dt>Due ' + esc(fmtTime(j.dueAt)) + '</dt><dd class="' + dueCls + '">' + esc(dueText(j, now)) + '</dd></div>') +
      '<div><dt>On board</dt><dd>' + esc(fmtDur(now - j.createdAt)) + '</dd></div></dl>' +
      (j.products && j.products.length ? '<div class="prods">' + j.products.map(p => '<span class="prod">' + esc(p) + '</span>').join("") + '</div>' : "") +
      (j.notes ? '<div class="vcolor" style="margin-top:8px;font-size:16px">Note: ' + esc(j.notes) + '</div>' : "") +
      '</button>';
  };
  const inner = '<div class="board-head">' + (S.tv ? '<div class="board-logo">' + logoHTML(true) + '</div>' : "") +
    '<h2>' + esc(title) + '</h2><span class="clock">' + esc(new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})) + '</span>' +
    (over ? '<span class="flag rush" style="font-size:18px;padding:4px 12px">' + over + ' overdue</span>' : "") +
    (S.online === false ? '<span class="flag rush" style="font-size:18px;padding:4px 12px">Offline, reconnecting…</span>' : "") +
    '<span class="spacer"></span>' +
    '<button class="btn" data-action="sound">' + (S.sound ? "Chime on" : "Turn on chime") + '</button>' +
    '<button class="btn" data-action="tv">' + (S.tv ? "Exit TV mode" : "TV mode") + '</button></div>' +
    '<div class="board-cols">' + cols.map(([k, l]) => {
      const list = sortJobs(all.filter(j => j.status === k));
      return '<div><div class="col-head"><h3>' + l + '</h3><span class="count">' + list.length + '</span></div><div class="col">' +
        (list.length ? list.map(card).join("") : '<div class="col-empty">' + (k === "queued" ? "No sold units waiting." : "None right now.") + '</div>') + '</div></div>';
    }).join("") + '</div>';
  const strip = usedStrip(S.store);   // used cars add-on: empty string when off, so the board is unchanged
  return (strip ? '<section class="board has-used"><div class="board-main">' + inner + '</div>' + strip + '</section>' : '<section class="board">' + inner + '</section>') +
    (S.tv ? '<button class="tv-exit" data-action="tv">Exit TV mode</button>' : "");
}

/* --- All stores --- */
function storeStats(id, now){
  const all = byStore(id), act = all.filter(j => j.status !== "delivered");
  const turned = all.filter(j => j.readyAt && isToday(j.readyAt));
  const avg = turned.length ? turned.reduce((s, j) => s + (j.readyAt - j.createdAt), 0) / turned.length : null;
  return {
    act, waiting: act.filter(j => j.status === "queued").length, working: act.filter(j => j.status === "working").length,
    ready: act.filter(j => j.status === "ready").length, over: act.filter(j => urgency(j, now) === "bad"),
    delivered: all.filter(j => j.status === "delivered" && isToday(j.deliveredAt)).length, avg,
    sold: all.filter(j => isToday(j.createdAt)).length
  };
}
function viewStores(){
  const now = Date.now(), tot = storeStats("*", now);
  const tiles = stores().map(s => {
    const st = storeStats(s.id, now);
    const top = sortJobs(st.act.filter(j => j.status !== "ready")).slice(0, 3);
    return '<div class="store-tile' + (st.over.length ? " has-bad" : "") + '"><div class="row"><h3>' + esc(s.name) + '</h3><span class="spacer"></span>' + (st.over.length ? '<span class="flag rush">' + st.over.length + ' overdue</span>' : "") + '</div>' +
      '<div class="tile-counts"><div><b>' + st.waiting + '</b><span>Waiting</span></div><div><b>' + st.working + '</b><span>In progress</span></div><div><b>' + st.ready + '</b><span>Ready</span></div></div>' +
      '<div class="tile-line">Today: <b>' + st.sold + '</b> sold, <b>' + st.delivered + '</b> delivered' + (st.avg ? ', avg turn <b>' + esc(fmtDur(st.avg)) + '</b>' : "") + '</div>' + storeScoreLine(s.id) + usedTileLine(s.id) +
      (top.length ? '<div class="mini">' + top.map(j => '<div><span>' + esc(vehicle(j)) + ' #' + esc(j.stock) + '</span><span class="' + (urgency(j, now) === "bad" ? "over" : "muted") + '">' + esc(dueText(j, now)) + '</span></div>').join("") + '</div>' : '<div class="tile-line">Shop is clear.</div>') +
      '<div class="row"><button class="btn primary" data-action="dive" data-store="' + esc(s.id) + '" data-to="board">Open board</button><button class="btn" data-action="dive" data-store="' + esc(s.id) + '" data-to="queue">Queue</button></div></div>';
  }).join("");
  return '<h2>All stores</h2>' +
    '<div class="totals"><div class="total"><b>' + tot.sold + '</b><span>Sold today</span></div><div class="total"><b>' + tot.act.length + '</b><span>On boards now</span></div>' +
    '<div class="total' + (tot.over.length ? " bad" : "") + '"><b>' + tot.over.length + '</b><span>Overdue</span></div><div class="total"><b>' + tot.ready + '</b><span>Ready for delivery</span></div>' +
    '<div class="total"><b>' + (tot.avg ? esc(fmtDur(tot.avg)) : "—") + '</b><span>Avg turn today</span></div>' + totalScoreTile() + '</div>' +
    '<div class="store-grid">' + tiles + '</div>';
}
