<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teph Seal Delivery Board</title>
<meta name="theme-color" content="#1C4476">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Delivery Board">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#13202D; --muted:#5A6777; --line:#DCE2E9; --chip:#ECF0F5;
  --brand:#1C4476; --brand-ink:#FFFFFF;
  --ok:#1E8757; --warn:#B97F00; --bad:#C3352B; --ready:#1F5FA8;
  --shop-bg:#0E1A27; --shop-card:#162536; --shop-ink:#F1F4F8; --shop-muted:#98A9BC; --shop-line:#22374C;
  --shop-ok:#33B57A; --shop-warn:#F2B630; --shop-bad:#FF5A4E; --shop-ready:#5AA2F2;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0C151F; --surface:#142030; --ink:#E8EDF3; --muted:#98A7B8; --line:#25354A; --chip:#1C2A3B; --brand:#4D8FDA; }
}
:root[data-theme="dark"]{ --bg:#0C151F; --surface:#142030; --ink:#E8EDF3; --muted:#98A7B8; --line:#25354A; --chip:#1C2A3B; --brand:#4D8FDA; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ margin:0; }
body{ background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; }
img{ max-width:100%; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--brand); outline-offset:2px; }
.hidden{ display:none !important; }

/* Header */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line); }
.top-in{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:10px 16px; max-width:1400px; margin:0 auto; }
.logo{ justify-self:center; display:flex; align-items:center; height:56px; }
.logo img{ max-height:56px; width:auto; }
.logo-white{ display:none; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo-navy{ display:none; } :root:not([data-theme="light"]) .logo-white{ display:inline; } }
:root[data-theme="dark"] .logo-navy{ display:none; } :root[data-theme="dark"] .logo-white{ display:inline; }
.wordmark{ font-family:var(--cond); font-weight:700; font-size:28px; letter-spacing:.02em; color:var(--brand); line-height:1; }
.wordmark span{ color:var(--ink); font-weight:500; }
.top-left{ justify-self:start; min-width:0; }
.top-right{ justify-self:end; }
.store-select{ max-width:100%; padding:8px 30px 8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-weight:600; }
.role-btn{ border:1px solid var(--line); background:var(--chip); border-radius:999px; padding:7px 14px; font-weight:600; font-size:14px; white-space:nowrap; }
.tabs{ display:flex; gap:4px; padding:0 12px; max-width:1400px; margin:0 auto; overflow-x:auto; }
.tab{ border:0; background:none; padding:12px 14px; font-weight:600; color:var(--muted); border-bottom:3px solid transparent; white-space:nowrap; }
.tab[aria-current="page"]{ color:var(--ink); border-bottom-color:var(--brand); }
main{ max-width:1400px; margin:0 auto; padding:20px 16px 60px; }
.banner{ max-width:1400px; margin:12px auto 0; padding:10px 16px; border-radius:10px; background:var(--chip); color:var(--muted); font-size:14px; }

/* Generic */
h1,h2,h3{ font-family:var(--cond); font-weight:700; line-height:1.1; margin:0; }
h2{ font-size:28px; }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; }
.narrow{ max-width:640px; margin:0 auto; }
.muted{ color:var(--muted); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 16px; font-weight:600; min-height:44px; }
.btn.primary{ background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
.btn.danger{ color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%,var(--line)); }
.btn.big{ width:100%; min-height:58px; font-size:19px; border-radius:12px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.spacer{ flex:1; }

/* Forms */
.form{ display:grid; gap:18px; }
.field{ display:grid; gap:6px; }
.field > span{ font-weight:600; font-size:15px; }
.field > span em{ font-style:normal; color:var(--bad); }
.input{ width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface); font-size:17px; min-height:50px; }
textarea.input{ min-height:80px; resize:vertical; }
.input.err{ border-color:var(--bad); }
.err-msg{ color:var(--bad); font-size:14px; font-weight:600; }
.grid3{ display:grid; grid-template-columns:110px 1fr 1fr; gap:10px; }
@media (max-width:520px){ .grid3{ grid-template-columns:1fr 1fr; } .grid3 > :first-child{ grid-column:1 / -1; } }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip-opt{ position:relative; }
.chip-opt input{ position:absolute; opacity:0; inset:0; }
.chip-opt span{ display:inline-flex; align-items:center; min-height:46px; padding:8px 16px; border:2px solid var(--line); border-radius:999px; font-weight:600; background:var(--surface); user-select:none; }
.chip-opt input:checked + span{ border-color:var(--brand); background:color-mix(in srgb,var(--brand) 12%,var(--surface)); color:var(--brand); }
.chip-opt input:focus-visible + span{ outline:3px solid var(--brand); outline-offset:2px; }
.toggle-row{ display:flex; gap:10px; flex-wrap:wrap; }
.warn-box{ border:2px solid var(--warn); background:color-mix(in srgb,var(--warn) 10%,var(--surface)); border-radius:10px; padding:12px 14px; font-weight:600; }
.success{ text-align:center; padding:40px 20px; }
.success .check{ width:72px; height:72px; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center; margin:0 auto 16px; font-size:40px; }

/* Status pills */
.pill{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:700; background:var(--chip); white-space:nowrap; }
.pill.queued{ color:var(--muted); }
.pill.working{ background:color-mix(in srgb,var(--warn) 16%,transparent); color:var(--warn); }
.pill.ready{ background:color-mix(in srgb,var(--ready) 15%,transparent); color:var(--ready); }
.pill.delivered{ background:color-mix(in srgb,var(--ok) 15%,transparent); color:var(--ok); }
.flag{ display:inline-flex; padding:2px 8px; border-radius:6px; font-size:13px; font-weight:700; }
.flag.rush{ background:var(--bad); color:#fff; }
.flag.wait{ background:var(--warn); color:#1a1300; }

/* Queue list */
.filters{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
.filter{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-weight:600; min-height:42px; }
.filter[aria-pressed="true"]{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
.list{ display:grid; gap:10px; }
.job-row{ display:grid; grid-template-columns:6px 1fr auto; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px 12px 0; overflow:hidden; }
.job-row .bar{ align-self:stretch; border-radius:0 4px 4px 0; background:var(--line); }
.job-row.u-ok .bar{ background:var(--ok); } .job-row.u-warn .bar{ background:var(--warn); } .job-row.u-bad .bar{ background:var(--bad); } .job-row.u-ready .bar{ background:var(--ready); }
.job-main{ min-width:0; cursor:pointer; border:0; background:none; text-align:left; padding:0; }
.job-title{ font-family:var(--cond); font-size:22px; font-weight:700; line-height:1.15; }
.job-meta{ color:var(--muted); font-size:14px; display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:2px; }
.job-meta b{ color:var(--ink); font-weight:600; }
.job-act{ display:flex; gap:8px; align-items:center; }
@media (max-width:560px){ .job-row{ grid-template-columns:6px 1fr; } .job-act{ grid-column:2; } }
.empty{ text-align:center; padding:48px 20px; color:var(--muted); }
.empty h3{ color:var(--ink); font-size:24px; margin-bottom:6px; }

/* Board (shop TV) */
.board{ background:var(--shop-bg); color:var(--shop-ink); border-radius:18px; padding:20px; min-height:70vh; }
body.tv .board{ border-radius:0; min-height:100%; }
.board-head{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.board-head h2{ font-size:clamp(28px,3vw,48px); }
.board-head .clock{ font-family:var(--cond); font-size:clamp(24px,2.4vw,40px); font-weight:600; color:var(--shop-muted); }
.board-head .btn{ background:transparent; color:var(--shop-ink); border-color:var(--shop-line); }
.board-cols{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
@media (max-width:900px){ .board-cols{ grid-template-columns:1fr; } }
.col-head{ display:flex; align-items:baseline; justify-content:space-between; padding:0 4px 10px; border-bottom:2px solid var(--shop-line); margin-bottom:12px; }
.col-head h3{ font-size:clamp(22px,2vw,34px); }
.col-head .count{ font-family:var(--cond); font-size:clamp(28px,2.4vw,44px); font-weight:700; color:var(--shop-muted); }
.col{ display:grid; gap:12px; align-content:start; }
.card{ text-align:left; width:100%; border:0; color:inherit; background:var(--shop-card); border-radius:14px; padding:14px 16px 14px 20px; position:relative; overflow:hidden; }
.card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--shop-line); }
.card.u-ok::before{ background:var(--shop-ok); } .card.u-warn::before{ background:var(--shop-warn); } .card.u-bad::before{ background:var(--shop-bad); } .card.u-ready::before{ background:var(--shop-ready); }
.card.u-bad{ box-shadow:inset 0 0 0 2px var(--shop-bad); }
.card-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.stock{ font-family:var(--cond); font-weight:600; font-size:clamp(17px,1.4vw,24px); color:var(--shop-muted); }
.store-tag{ font-size:13px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--shop-line); color:var(--shop-ink); }
.veh{ font-family:var(--cond); font-size:clamp(26px,2.4vw,42px); font-weight:700; line-height:1.05; margin:4px 0 2px; }
.vcolor{ color:var(--shop-muted); font-size:clamp(16px,1.3vw,22px); }
.card-stats{ display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr); gap:4px 18px; margin-top:12px; }
.card-stats div:not(:first-child) dd{ white-space:nowrap; }
.card-stats dt{ font-size:clamp(12px,.9vw,15px); color:var(--shop-muted); }
.card-stats dd{ margin:0; font-family:var(--cond); font-weight:700; font-size:clamp(20px,1.7vw,30px); line-height:1.1; }
.card-stats .due-bad{ color:var(--shop-bad); } .card-stats .due-warn{ color:var(--shop-warn); } .card-stats .due-ok{ color:var(--shop-ok); }
.prods{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.prod{ font-size:clamp(13px,1vw,16px); font-weight:600; padding:3px 10px; border-radius:999px; border:1px solid var(--shop-line); color:var(--shop-ink); }
.card .flag{ font-size:clamp(13px,1vw,17px); }
.col-empty{ color:var(--shop-muted); padding:20px 4px; font-size:18px; }
@keyframes arrive{ 0%,100%{ box-shadow:0 0 0 0 transparent; } 50%{ box-shadow:0 0 0 6px var(--shop-ready); } }
.card.new{ animation:arrive 1.4s ease-in-out 8; }
.arrival{ position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 20px); transform:translateX(-50%); z-index:60; background:var(--shop-ready); color:#06121f; padding:18px 30px; border-radius:16px; font-family:var(--cond); font-weight:700; font-size:clamp(26px,3vw,48px); box-shadow:0 10px 40px rgba(0,0,0,.4); text-align:center; }
.arrival small{ display:block; font-family:var(--sans); font-size:clamp(15px,1.3vw,22px); font-weight:600; }
body.tv .top, body.tv .tabs, body.tv .banner{ display:none; }
body.tv main{ max-width:none; padding:0; }
body.tv{ background:var(--shop-bg); }
.tv-exit{ position:fixed; right:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); z-index:50; opacity:.35; background:var(--shop-card); color:var(--shop-ink); border:1px solid var(--shop-line); border-radius:10px; padding:8px 12px; font-weight:600; }
.tv-exit:hover,.tv-exit:focus-visible{ opacity:1; }
.board-logo{ height:56px; display:flex; align-items:center; }
.board-logo img{ max-height:56px; }
.board-logo .wordmark{ color:var(--shop-ready); } .board-logo .wordmark span{ color:var(--shop-ink); }

/* Stores overview */
.totals{ display:flex; gap:12px; flex-wrap:wrap; margin:12px 0 20px; }
.total{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 18px; min-width:130px; }
.total b{ display:block; font-family:var(--cond); font-size:34px; line-height:1; }
.total span{ color:var(--muted); font-size:14px; font-weight:600; }
.total.bad b{ color:var(--bad); }
.store-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; }
.store-tile{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:grid; gap:12px; }
.store-tile.has-bad{ border-color:var(--bad); box-shadow:inset 0 0 0 1px var(--bad); }
.store-tile h3{ font-size:24px; }
.tile-counts{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.tile-counts div{ background:var(--chip); border-radius:10px; padding:8px 10px; }
.tile-counts b{ display:block; font-family:var(--cond); font-size:28px; line-height:1; }
.tile-counts span{ font-size:13px; color:var(--muted); font-weight:600; }
.tile-line{ font-size:14px; color:var(--muted); }
.tile-line b{ color:var(--ink); }
.tile-line .bad{ color:var(--bad); font-weight:700; }
.mini{ display:grid; gap:4px; font-size:14px; }
.mini div{ display:flex; justify-content:space-between; gap:10px; }
.mini .over{ color:var(--bad); font-weight:700; }

/* Sheet */
.backdrop{ position:fixed; inset:0; background:rgba(5,12,20,.55); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
@media (min-width:700px){ .backdrop{ align-items:center; } }
.sheet{ background:var(--surface); color:var(--ink); width:100%; max-width:640px; max-height:92%; overflow:auto; border-radius:18px 18px 0 0; padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 24px); }
@media (min-width:700px){ .sheet{ border-radius:18px; } }
.sheet-head{ display:flex; gap:12px; align-items:flex-start; }
.sheet-head h2{ font-size:30px; }
.x{ border:0; background:var(--chip); width:44px; height:44px; border-radius:50%; font-size:22px; line-height:1; flex:none; }
.sec{ border-top:1px solid var(--line); padding-top:16px; margin-top:16px; }
.sec h3{ font-size:20px; margin-bottom:10px; }
.seg{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
@media (max-width:480px){ .seg{ grid-template-columns:repeat(2,1fr); } }
.seg button{ min-height:52px; border:2px solid var(--line); background:var(--surface); border-radius:10px; font-weight:700; }
.seg button[aria-pressed="true"]{ border-color:var(--brand); background:var(--brand); color:var(--brand-ink); }
.times{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px 16px; margin:0; }
.times dt{ font-size:13px; color:var(--muted); font-weight:600; }
.times dd{ margin:0; font-weight:600; }
.log{ list-style:none; padding:0; margin:0; display:grid; gap:6px; font-size:14px; color:var(--muted); }
.log b{ color:var(--ink); font-weight:600; }

/* Onboarding */
.role-grid{ display:grid; gap:12px; margin-top:18px; }
.role-card{ text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:14px; padding:16px 18px; display:grid; gap:2px; }
.role-card b{ font-family:var(--cond); font-size:24px; }
.role-card span{ color:var(--muted); }
.role-card:hover{ border-color:var(--brand); }

/* Settings */
.set-list{ display:grid; gap:8px; margin:10px 0; }
.set-item{ display:flex; gap:8px; align-items:center; }
.set-item .input{ min-height:44px; padding:8px 12px; font-size:16px; }
.settings{ display:grid; gap:16px; }

.toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 22px); transform:translateX(-50%); z-index:70; background:var(--ink); color:var(--surface); padding:12px 20px; border-radius:12px; font-weight:600; max-width:calc(100% - 32px); }
.toast.bad{ background:var(--bad); color:#fff; }

@media (prefers-reduced-motion: reduce){ .card.new{ animation:none; outline:4px solid var(--shop-ready); } }
</style>
</head>
<body>
<header class="top" id="top"></header>
<div id="banner"></div>
<main id="main"></main>
<div id="sheetRoot"></div>
<div id="fx"></div>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("tsboard:" + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("tsboard:" + k, JSON.stringify(v)); }catch(e){} }
};
const MIN = 60000, HOUR = 3600000;
function fmtDur(ms){
  ms = Math.max(0, ms);
  const m = Math.floor(ms / MIN);
  if (m < 1) return "just now";
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60), mm = m % 60;
  if (h < 24) return h + "h" + (mm ? " " + mm + "m" : "");
  const d = Math.floor(h / 24);
  return d + "d " + (h % 24) + "h";
}
function fmtTime(t){
  if (!t) return "—";
  const d = new Date(t), now = new Date();
  const time = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  if (d.toDateString() === now.toDateString()) return time;
  const tm = new Date(now); tm.setDate(now.getDate() + 1);
  if (d.toDateString() === tm.toDateString()) return "Tomorrow " + time;
  const ys = new Date(now); ys.setDate(now.getDate() - 1);
  if (d.toDateString() === ys.toDateString()) return "Yesterday " + time;
  return d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}) + " " + time;
}
function isToday(t){ return t && new Date(t).toDateString() === new Date().toDateString(); }
function uid(){ return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }

const DEFAULT_PRODUCTS = ["Paint protection","Interior protection","Ceramic coating","Window tint","Windshield protection","Leather protection","Undercoating"];
const MAKES = ["Acura","Audi","BMW","Buick","Cadillac","Chevrolet","Chrysler","Dodge","Ford","Genesis","GMC","Honda","Hyundai","Infiniti","Jeep","Kia","Land Rover","Lexus","Lincoln","Mazda","Mercedes-Benz","Mitsubishi","Nissan","Porsche","Ram","Subaru","Tesla","Toyota","Volkswagen","Volvo"];
const STATUS = { queued:"Waiting", working:"In progress", ready:"Ready", delivered:"Delivered" };
const ROLES = {
  sales:   { label:"Sales",         desc:"Salespeople and sales managers: add, edit and track units for your store.", tabs:["add","queue","board"] },
  finance: { label:"Finance",       desc:"Add the protection products you sold.",            tabs:["queue","add"] },
  shop:    { label:"Detail shop",   desc:"The big screen and status updates for detailers.",  tabs:["board","queue"] },
  area:    { label:"Area manager",  desc:"All stores at a glance, plus setup.",               tabs:["stores","board","queue","add","settings"] }

/* ---------- state ---------- */
const S = {
  role: LS.get("role", null), store: LS.get("store", null), me: LS.get("me", ""),
  view: null, jobs: [], config: { stores: [], products: null, logoId: null },
  loaded: false, live: false, canWrite: true, assets: null,
  unlock: LS.get("unlock", null), lock: LS.get("lock", null),
  filter: "active", sheet: null, sound: false, tv: false,
  addDone: null, dupeOk: false, newIds: new Map()
};
if (S.role === "manager"){ S.role = "sales"; LS.set("role", "sales"); if (S.unlock && S.unlock.role === "manager"){ S.unlock.role = "sales"; LS.set("unlock", S.unlock); } }
if (!S.lock && S.unlock && S.unlock.role !== "area" && S.unlock.store){ S.lock = S.unlock.store; LS.set("lock", S.lock); }
const boot = Date.now();
const products = () => (S.config.products && S.config.products.length) ? S.config.products : DEFAULT_PRODUCTS;
const stores = () => S.config.stores || [];
const storeName = id => (stores().find(s => s.id === id) || {}).name || "Unknown store";
const byStore = (id) => S.jobs.filter(j => id === "*" || j.store === id);
const activeJobs = id => byStore(id).filter(j => j.status !== "delivered");

function urgency(j, now){
  if (j.status === "ready") return "ready";
  if (j.status === "delivered") return "";
  const left = (j.dueAt || 0) - now;
  if (left < 0) return "bad";
  if (left < 30 * MIN) return "warn";
  return "ok";
}
function dueText(j, now){
  if (!j.dueAt) return "—";
  const left = j.dueAt - now;
  if (left < 0) return fmtDur(-left) + " late";
  return "in " + fmtDur(left);
}
function vehicle(j){ return [j.year, j.make, j.model].filter(Boolean).join(" ") || "Vehicle"; }
function sortJobs(list){ return list.slice().sort((a, b) => (a.dueAt || 0) - (b.dueAt || 0)); }

/* ---------- data layer (live db, or in-memory preview) ---------- */
let db = null;
const mem = { jobs: new Map() };
function memEmit(){ S.jobs = [...mem.jobs.entries()].map(([id, d]) => Object.assign({id}, d)).sort((a,b)=>b.createdAt-a.createdAt); render(); }
async function guard(p){
  let r;
  try{ r = await p; }catch(e){ r = { error: e }; }
  if (r && r.error){ toast("That didn't save. Check your connection and try again.", true); throw r.error; }
  return r;
}
const mine = new Set();
function upsertLocal(j){ const i = S.jobs.findIndex(x => x.id === j.id); if (i >= 0) S.jobs[i] = j; else S.jobs.unshift(j); }
const api = {
  async add(data){
    const id = (crypto.randomUUID ? crypto.randomUUID() : "j" + uid() + uid());
    if (db){ mine.add(id); await guard(db.from("jobs").insert({ id, data, created_at: data.createdAt })); upsertLocal(Object.assign({ id }, data)); render(); return id; }
    mem.jobs.set(id, Object.assign({}, data)); memEmit(); return id;
  },
  async update(id, patch){
    patch.updatedAt = Date.now();
    if (db){
      const cur = S.jobs.find(j => j.id === id) || {};
      const next = Object.assign({}, cur, patch); delete next.id;
      await guard(db.from("jobs").update({ data: next }).eq("id", id));
      upsertLocal(Object.assign({ id }, next)); render(); return;
    }
    mem.jobs.set(id, Object.assign({}, mem.jobs.get(id), patch)); memEmit();
  },
  async remove(id){
    if (db){ await guard(db.from("jobs").delete().eq("id", id)); S.jobs = S.jobs.filter(j => j.id !== id); render(); return; }
    mem.jobs.delete(id); memEmit();
  },
  async saveConfig(cfg){ S.config = cfg; if (db) await guard(db.from("config").upsert({ id: "settings", data: cfg })); render(true); }
};

/* ---------- sound ---------- */
let audio = null;
function chime(){
  if (!S.sound || !audio) return;
  try{
    const t = audio.currentTime;
    [[880,0],[1175,.18],[1568,.36]].forEach(([f, d]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.35, t + d + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + .5);
      o.connect(g).connect(audio.destination); o.start(t + d); o.stop(t + d + .55);
    });
  }catch(e){}
}

/* ---------- toasts ---------- */
let toastTimer = null;
function toast(msg, bad){
  const fx = $("#fx");
  fx.querySelectorAll(".toast").forEach(n => n.remove());
  const n = document.createElement("div"); n.className = "toast" + (bad ? " bad" : ""); n.setAttribute("role","status"); n.textContent = msg; fx.appendChild(n);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => n.remove(), bad ? 6000 : 3000);
}
function arrival(j){
  const fx = $("#fx");
  const n = document.createElement("div"); n.className = "arrival"; n.setAttribute("role","alert");
  n.innerHTML = "Sold unit just hit<small></small>";
  n.querySelector("small").textContent = vehicle(j) + (j.stock ? "  #" + j.stock : "") + "  —  " + (j.salesperson || "");
  fx.appendChild(n); setTimeout(() => n.remove(), 9000);
}

function logoHTML(onDark){
  if (onDark) return '<img src="' + LOGO_WHITE + '" alt="Teph Seal">';
  return '<img class="logo-navy" src="' + LOGO_NAVY + '" alt="Teph Seal"><img class="logo-white" src="' + LOGO_WHITE + '" alt="Teph Seal">';
}
function render(force){
  renderShell();
  if (force || !FORM_VIEWS.has(S.view) || !$("#main").dataset.view || $("#main").dataset.view !== S.view) renderMain();
  if (S.sheet) renderSheet();
}
function renderShell(){
  document.body.classList.toggle("tv", S.tv);
  const top = $("#top");
  if (!S.role){ top.innerHTML = '<div class="top-in"><div></div><div class="logo">' + logoHTML() + '</div><div></div></div>'; $("#banner").innerHTML = ""; return; }
  const r = ROLES[S.role];
  if (!S.view || !r.tabs.includes(S.view)) S.view = r.tabs[0];
  const st = stores();
  let sel = "";
  if (st.length && S.role !== "area" && S.store && S.store !== "*" && unlocked()){ sel = '<div style="font-weight:700">' + esc(storeName(S.store)) + '</div>'; }
  else if (st.length && S.role === "area" && S.view !== "stores" && S.view !== "settings"){
    sel = '<select class="store-select" data-action="store" aria-label="Store">' +
      (S.role === "area" ? '<option value="*"' + (S.store === "*" ? " selected" : "") + '>All stores</option>' : "") +
      st.map(s => '<option value="' + esc(s.id) + '"' + (s.id === S.store ? " selected" : "") + '>' + esc(s.name) + '</option>').join("") + '</select>';
  }
  top.innerHTML =
    '<div class="top-in"><div class="top-left">' + sel + '</div><div class="logo">' + logoHTML() + '</div>' +
    '<div class="top-right"><button class="role-btn" data-action="switch-role" title="Change who is using this device">' + esc(r.label) + (S.me ? " · " + esc(S.me.split(" ")[0]) : "") + '</button></div></div>' +
    (r.tabs.length > 1 ? '<nav class="tabs" aria-label="Sections">' + r.tabs.map(t => '<button class="tab" data-action="tab" data-tab="' + t + '"' + (t === S.view ? ' aria-current="page"' : "") + '>' + TAB_LABEL[t] + '</button>').join("") + '</nav>' : "");
  let b = "";
  if (S.loaded && !S.live) b = "Setup needed: add your Supabase details to index.html. Until then, changes stay on this screen only.";
  else if (S.loaded && S.online === false) b = "Can’t reach the board right now. Check the Wi-Fi. It will reconnect on its own." + (S.lastErr ? " (" + S.lastErr + ")" : "");
  $("#banner").innerHTML = b ? '<div class="banner">' + esc(b) + '</div>' : "";
}
function renderMain(){
  const m = $("#main");
  m.dataset.view = S.view || "";
  if (!S.role) return m.innerHTML = viewRoles();
  if (!S.loaded) return m.innerHTML = '<div class="empty"><h3>Loading the board…</h3></div>';
  if (S.role !== "area" && !S.me && S.role !== "shop" && !S.skipName) return m.innerHTML = viewName();
  if (S.role === "area" && !unlocked()){
    if (S.config.masterPin) return m.innerHTML = viewCode();
    setUnlock("*");
  }
  if (S.view === "settings"){ m.innerHTML = viewSettings(); return; }
  if (!stores().length) return m.innerHTML = viewNoStores();
  if (S.role === "area"){
    if (!S.store || (S.store !== "*" && !stores().some(s => s.id === S.store))){ S.store = "*"; LS.set("store", S.store); renderShell(); }
  } else if (!unlocked()){
    if (codesOn()) return m.innerHTML = viewCode();
    if (stores().length === 1){ S.store = stores()[0].id; LS.set("store", S.store); setUnlock(S.store); renderShell(); }
    else return m.innerHTML = viewPickStore();
  }
  const v = { add:viewAdd, queue:viewQueue, board:viewBoard, stores:viewStores, settings:viewSettings }[S.view];
  m.innerHTML = v();
  if (S.view === "add") wireAdd();
}

function codesOn(){ return stores().some(s => s.code); }
function unlocked(){
  if (S.role === "area") return !!(S.unlock && S.unlock.role === "area");
  if (S.lock && stores().some(s => s.id === S.lock)){ S.store = S.lock; return true; }
  return false;
}
function setUnlock(store){
  S.store = store; LS.set("store", store);
  if (S.role === "area"){ S.unlock = { role: "area" }; LS.set("unlock", S.unlock); }
  else { S.lock = store; LS.set("lock", store); }
}
function viewCode(){
  const area = S.role === "area";
  return '<form class="narrow panel form" data-form="code" autocomplete="off"><h2>' + (area ? "Enter the area manager PIN" : "Enter your store code") + '</h2>' +
    '<p class="muted" style="margin:0">' + (area ? "This unlocks all stores on this device." : "Your manager can give you this code. It connects this device to your store only.") + '</p>' +
    '<input class="input" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autofocus aria-label="Code" style="font-size:30px;letter-spacing:.3em;text-align:center">' +
    '<div id="codeErr"></div><button class="btn primary big" type="submit">Unlock</button></form>';
}
let codeTries = 0, codeWaitUntil = 0;
function tryCode(f){
  const v = String(f.code.value || "").trim(), err = $("#codeErr");
  if (Date.now() < codeWaitUntil){ err.innerHTML = '<div class="err-msg">Too many tries. Wait a minute and try again.</div>'; return; }
  let ok = null;
  if (S.role === "area") ok = (v && v === String(S.config.masterPin)) ? "*" : null;
  else {
    const hit = stores().find(s => s.code && v === String(s.code));
    ok = hit ? hit.id : null;
  }
  if (!ok){ codeTries++; if (codeTries >= 5){ codeTries = 0; codeWaitUntil = Date.now() + 60000; } err.innerHTML = '<div class="err-msg" role="alert">That code didn’t match. Check with your manager.</div>'; f.code.value = ""; f.code.focus(); return; }
  codeTries = 0; setUnlock(ok); render(true);
}
function newCode(used){ let c; do { c = String(Math.floor(1000 + Math.random() * 9000)); } while (used.includes(c)); return c; }
function allCodes(){ return stores().flatMap(s => [s.code]).concat([S.config.masterPin]).filter(Boolean).map(String); }
function viewRoles(){
  return '<div class="narrow"><h2>Who’s using this device?</h2><p class="muted">Pick once. This device will remember it, and you can change it any time from the top right.</p><div class="role-grid">' +
    Object.entries(ROLES).map(([k, r]) => '<button class="role-card" data-action="pick-role" data-role="' + k + '"><b>' + r.label + '</b><span>' + r.desc + '</span></button>').join("") + '</div>' +
    (S.lock ? '<div class="panel" style="margin-top:20px"><p style="margin:0 0 10px"><b>This device is locked to ' + esc(stores().some(s => s.id === S.lock) ? storeName(S.lock) : "its store") + '.</b> Only an area manager can move it to a different store.</p>' +
      (S.releasing ? '<form class="form" data-form="release" autocomplete="off"><input class="input" name="code" inputmode="numeric" maxlength="6" placeholder="Area manager PIN" aria-label="Area manager PIN" autofocus><div id="codeErr"></div><div class="row"><button class="btn primary" type="submit">Unlock store</button><button class="btn" type="button" data-action="release-cancel">Cancel</button></div></form>'
        : '<button class="btn" data-action="release-start">Change store (area manager)</button>') + '</div>' : "") + '</div>';
}
function viewName(){
  return '<form class="narrow panel form" data-form="name"><h2>What’s your name?</h2><p class="muted" style="margin:0">It shows on the units you add so the shop knows who to ask.</p>' +
    '<label class="field"><span>First and last name</span><input class="input" name="me" autocomplete="name" required autofocus></label>' +
    '<button class="btn primary big" type="submit">Continue</button></form>';
}
function viewPickStore(){
  return '<div class="narrow"><h2>Which store are you at?</h2><div class="role-grid">' +
    stores().map(s => '<button class="role-card" data-action="pick-store" data-store="' + esc(s.id) + '"><b>' + esc(s.name) + '</b></button>').join("") + '</div></div>';
}
function viewNoStores(){
  const can = S.role === "area";
  return '<div class="empty"><h3>No stores yet</h3><p>' + (can ? "Add your stores to start using the board." : "Ask your area manager to add your store, then come back here.") + '</p>' +
    (S.role === "area" ? '<button class="btn primary" data-action="tab" data-tab="settings">Add stores</button>' : "") + '</div>';
}

/* --- Add sold unit --- */
function duePresets(){
  const now = new Date(), list = [["60","1 hour"],["120","2 hours"],["240","4 hours"]];
  if (now.getHours() < 16 && new Date(now).setHours(17,0,0,0) - now >= HOUR) list.push(["eod","Today 5 PM"]);
  list.push(["tom","Tomorrow 9 AM"], ["custom","Pick a time"]);
  return list;
}
function dueFromPreset(p, custom){
  const now = new Date();
  if (p === "eod"){ const d = new Date(now); d.setHours(17,0,0,0); return d.getTime(); }
  if (p === "tom"){ const d = new Date(now); d.setDate(d.getDate()+1); d.setHours(9,0,0,0); return d.getTime(); }
  if (p === "custom"){ const t = custom ? new Date(custom).getTime() : NaN; return isNaN(t) ? null : t; }
  return Date.now() + Number(p) * MIN;
}
function viewAdd(){
  if (!S.canWrite) return '<div class="empty"><h3>View only</h3><p>This device can’t add units.</p></div>';
  if (S.addDone){
    const j = S.addDone;
    return '<div class="narrow panel success"><div class="check" aria-hidden="true">✓</div><h2>Sent to the detail shop</h2><p class="muted">' + esc(vehicle(j)) + ' #' + esc(j.stock) + ' is on the board at ' + esc(storeName(j.store)) + '. Due ' + esc(fmtTime(j.dueAt)) + '.</p>' +
      '<div class="row" style="justify-content:center;margin-top:18px"><button class="btn primary" data-action="add-another">Add another</button><button class="btn" data-action="tab" data-tab="queue">See the queue</button></div></div>';
  }
  const st = stores();
  const storeField = (S.role === "area" && st.length > 1)
    ? '<label class="field"><span>Store <em>*</em></span><select class="input" name="store">' + st.map(s => '<option value="' + esc(s.id) + '"' + (s.id === S.store ? " selected" : "") + '>' + esc(s.name) + '</option>').join("") + '</select></label>'
    : '<input type="hidden" name="store" value="' + esc(S.role === "area" ? (S.store !== "*" ? S.store : st[0].id) : S.store) + '">';
  return '<form class="narrow panel form" data-form="add" novalidate autocomplete="off">' +
    '<h2>New sold unit</h2>' + storeField +
    '<label class="field"><span>Stock number <em>*</em></span><input class="input" name="stock" autocapitalize="characters" enterkeyhint="next" placeholder="e.g. T24519"></label>' +
    '<div class="field"><span>Vehicle <em>*</em></span><div class="grid3">' +
      '<input class="input" name="year" inputmode="numeric" maxlength="4" placeholder="Year" aria-label="Year">' +
      '<input class="input" name="make" list="makes" placeholder="Make" aria-label="Make">' +
      '<input class="input" name="model" placeholder="Model" aria-label="Model"></div>' +
      '<datalist id="makes">' + MAKES.map(m => '<option value="' + m + '">').join("") + '</datalist></div>' +
    '<label class="field"><span>Color</span><input class="input" name="color" placeholder="e.g. Silver"></label>' +
    '<label class="field"><span>Salesperson <em>*</em></span><input class="input" name="salesperson" value="' + esc(S.role === "sales" ? S.me : "") + '" autocomplete="name"></label>' +
    '<div class="field"><span>When does it need to be ready? <em>*</em></span><div class="chips">' +
      duePresets().map(([v, l]) => '<label class="chip-opt"><input type="radio" name="due" value="' + v + '"' + (v === "120" ? " checked" : "") + '><span>' + l + '</span></label>').join("") +
      '</div><input class="input hidden" type="datetime-local" name="dueCustom" aria-label="Ready by"></div>' +
    '<div class="field"><span>Flags</span><div class="toggle-row">' +
      '<label class="chip-opt"><input type="checkbox" name="waiting"><span>Customer is here waiting</span></label>' +
      '<label class="chip-opt"><input type="checkbox" name="rush"><span>Rush</span></label></div></div>' +
    '<div class="field"><span>Protection products sold <span class="muted" style="font-weight:400">(finance can add these later)</span></span><div class="chips">' +
      products().map(p => '<label class="chip-opt"><input type="checkbox" name="prod" value="' + esc(p) + '"><span>' + esc(p) + '</span></label>').join("") + '</div></div>' +
    '<label class="field"><span>Notes for the shop</span><textarea class="input" name="notes" placeholder="Anything the detailers should know"></textarea></label>' +
    '<div id="addErr"></div>' +
    '<button class="btn primary big" type="submit" id="addSubmit">Send to detail shop</button></form>';
}
function wireAdd(){
  const f = document.querySelector('[data-form="add"]'); if (!f) return;
  f.addEventListener("change", e => {
    if (e.target.name === "due") f.dueCustom.classList.toggle("hidden", e.target.value !== "custom");
    if (e.target.name === "stock" || e.target.name === "store"){ S.dupeOk = false; $("#addSubmit").textContent = "Send to detail shop"; $("#addErr").innerHTML = ""; }
  });
}
async function submitAdd(f){
  const fd = new FormData(f), g = k => String(fd.get(k) || "").trim();
  f.querySelectorAll(".err").forEach(n => n.classList.remove("err"));
  const errs = [];
  const stock = g("stock").toUpperCase();
  if (!stock){ errs.push("Enter the stock number."); f.stock.classList.add("err"); }
  if (!g("make") && !g("model")){ errs.push("Enter the make or model."); f.make.classList.add("err"); f.model.classList.add("err"); }
  const year = g("year");
  if (year && !/^\d{4}$/.test(year)){ errs.push("Year should be 4 digits, like 2025."); f.year.classList.add("err"); }
  if (!g("salesperson")){ errs.push("Enter the salesperson’s name."); f.salesperson.classList.add("err"); }
  const dueAt = dueFromPreset(g("due"), g("dueCustom"));
  if (!dueAt){ errs.push("Pick when it needs to be ready."); f.dueCustom.classList.add("err"); }
  else if (dueAt < Date.now() + HOUR - MIN){ errs.push("Ready time has to be at least 1 hour from now."); f.dueCustom.classList.add("err"); }
  const err = $("#addErr");
  if (errs.length){ err.innerHTML = '<div class="err-msg" role="alert">' + errs.map(esc).join("<br>") + '</div>'; f.querySelector(".err")?.focus(); return; }
  const store = g("store");
  const dupe = S.jobs.find(j => j.store === store && j.status !== "delivered" && String(j.stock).toUpperCase() === stock);
  if (dupe && !S.dupeOk){
    S.dupeOk = true;
    err.innerHTML = '<div class="warn-box" role="alert">Stock #' + esc(stock) + ' is already on the board (' + esc(STATUS[dupe.status]) + ', added by ' + esc(dupe.salesperson || "someone") + '). Only send it again if this is a different deal.</div>';
    $("#addSubmit").textContent = "Send it anyway";
    return;
  }
  const btn = $("#addSubmit"); btn.disabled = true; btn.textContent = "Sending…";
  const now = Date.now(), by = S.me || ROLES[S.role].label;
  const job = {
    store, stock, year, make: g("make"), model: g("model"), color: g("color"),
    salesperson: g("salesperson"), customer: g("customer"), dueAt,
    waiting: !!fd.get("waiting"), rush: !!fd.get("rush"),
    products: fd.getAll("prod").map(String), notes: g("notes"),
    status: "queued", createdAt: now, updatedAt: now, createdBy: by,
    log: [{ t: now, by, a: "Sent to shop" }]
  };
  if (S.role === "sales" && job.salesperson && !S.me){ S.me = job.salesperson; LS.set("me", S.me); }
  try{
    await api.add(job);
    S.addDone = job; S.dupeOk = false; S.store = store === S.store ? S.store : S.store; render(true);
  }catch(e){ btn.disabled = false; btn.textContent = "Send to detail shop"; }
}

/* --- Queue --- */
function viewQueue(){
  const now = Date.now(), all = byStore(S.store), p = perms(S.role);
  const groups = {
    active: all.filter(j => j.status === "queued" || j.status === "working"),
    ready: all.filter(j => j.status === "ready"),
    today: all.filter(j => j.status === "delivered" && isToday(j.deliveredAt)),
    all: all.filter(j => j.status !== "delivered")
  };
  const labels = { all:"Everything open", active:"In the shop", ready:"Ready for delivery", today:"Delivered today" };
  let list = groups[S.filter] || groups.all;
  list = S.filter === "today" ? list.slice().sort((a,b)=>b.deliveredAt-a.deliveredAt) : sortJobs(list);
  const title = S.store === "*" ? "All stores" : storeName(S.store);
  const rows = list.map(j => {
    const u = urgency(j, now);
    let act = "";
    if (p.products && j.status !== "delivered") act = '<button class="btn' + (S.role === "finance" ? " primary" : "") + '" data-action="open" data-id="' + esc(j.id) + '" data-focus="products">' + (j.products && j.products.length ? "Products (" + j.products.length + ")" : "Add products") + '</button>';
    const next = nextStep(j);
    if (next && S.canWrite) act += '<button class="btn primary" data-action="advance" data-id="' + esc(j.id) + '">' + next.label + '</button>';
    return '<div class="job-row u-' + u + '"><div class="bar"></div>' +
      '<button class="job-main" data-action="open" data-id="' + esc(j.id) + '"><div class="job-title">' + esc(vehicle(j)) + (j.color ? ' <span class="muted" style="font-weight:500">' + esc(j.color) + '</span>' : "") + '</div>' +
      '<div class="job-meta"><span>#<b>' + esc(j.stock) + '</b></span><span>' + esc(j.salesperson) + '</span>' +
      (S.store === "*" ? '<span>' + esc(storeName(j.store)) + '</span>' : "") +
      (j.status === "delivered" ? '<span>Delivered ' + esc(fmtTime(j.deliveredAt)) + '</span>' : '<span>Due <b' + (u === "bad" ? ' style="color:var(--bad)"' : "") + '>' + esc(dueText(j, now)) + '</b></span><span>On board ' + esc(fmtDur(now - j.createdAt)) + '</span>') +
      '<span class="pill ' + j.status + '">' + STATUS[j.status] + '</span>' +
      (j.rush ? '<span class="flag rush">Rush</span>' : "") + (j.waiting ? '<span class="flag wait">Customer waiting</span>' : "") + '</div></button>' +
      '<div class="job-act">' + act + '</div></div>';
  }).join("");
  return '<div class="row"><h2>' + esc(title) + '</h2><span class="spacer"></span>' + (p.add && S.canWrite ? '<button class="btn primary" data-action="tab" data-tab="add">+ Add sold unit</button>' : "") + '</div>' +
    '<div class="filters" role="group" aria-label="Filter">' + ["all","active","ready","today"].map(k => '<button class="filter" data-action="filter" data-f="' + k + '" aria-pressed="' + (S.filter === k) + '">' + labels[k] + ' (' + groups[k].length + ')</button>').join("") + '</div>' +
    (rows ? '<div class="list">' + rows + '</div>' : '<div class="empty panel"><h3>Nothing here</h3><p>' + (S.filter === "today" ? "No units delivered yet today." : "No units in this list right now.") + '</p></div>');
}
function nextStep(j){
  const p = perms(S.role);
  if (j.status === "queued" && p.status) return { to:"working", label:"Start" };
  if (j.status === "working" && p.status) return { to:"ready", label:"Mark ready" };
  if (j.status === "ready" && p.deliver) return { to:"delivered", label:"Delivered" };
  return null;
}

/* --- Shop board --- */
function viewBoard(){
  const now = Date.now(), all = activeJobs(S.store);
  const cols = [["queued","Waiting"],["working","In progress"],["ready","Ready for delivery"]];
  const over = all.filter(j => urgency(j, now) === "bad").length;
  const title = S.store === "*" ? "All stores" : storeName(S.store);
  const card = j => {
    const u = urgency(j, now), dueCls = u === "bad" ? "due-bad" : u === "warn" ? "due-warn" : "due-ok";
    return '<button class="card u-' + u + (S.newIds.has(j.id) ? " new" : "") + '" data-action="open" data-id="' + esc(j.id) + '">' +
      '<div class="card-top"><span class="stock">#' + esc(j.stock) + '</span>' +
      (S.store === "*" ? '<span class="store-tag">' + esc(storeName(j.store)) + '</span>' : "") +
      (j.rush ? '<span class="flag rush">Rush</span>' : "") + (j.waiting ? '<span class="flag wait">Customer waiting</span>' : "") + '</div>' +
      '<div class="veh">' + esc(vehicle(j)) + '</div>' + (j.color ? '<div class="vcolor">' + esc(j.color) + '</div>' : "") +
      '<dl class="card-stats"><div><dt>Salesperson</dt><dd>' + esc(j.salesperson || "—") + '</dd></div>' +
      (j.status === "ready" ? '<div><dt>Ready for</dt><dd>' + esc(fmtDur(now - (j.readyAt || now))) + '</dd></div>'
        : '<div><dt>Due ' + esc(fmtTime(j.dueAt)) + '</dt><dd class="' + dueCls + '">' + esc(dueText(j, now)) + '</dd></div>') +
      '<div><dt>On board</dt><dd>' + esc(fmtDur(now - j.createdAt)) + '</dd></div></dl>' +
      (j.products && j.products.length ? '<div class="prods">' + j.products.map(p => '<span class="prod">' + esc(p) + '</span>').join("") + '</div>' : "") +
      (j.notes ? '<div class="vcolor" style="margin-top:8px;font-size:16px">Note: ' + esc(j.notes) + '</div>' : "") +
      '</button>';
  };
  return '<section class="board"><div class="board-head">' + (S.tv ? '<div class="board-logo">' + logoHTML(true) + '</div>' : "") +
    '<h2>' + esc(title) + '</h2><span class="clock">' + esc(new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})) + '</span>' +
    (over ? '<span class="flag rush" style="font-size:18px;padding:4px 12px">' + over + ' overdue</span>' : "") +
    (S.online === false ? '<span class="flag rush" style="font-size:18px;padding:4px 12px">Offline, reconnecting…</span>' : "") +
    '<span class="spacer"></span>' +
    '<button class="btn" data-action="sound">' + (S.sound ? "Chime on" : "Turn on chime") + '</button>' +
    '<button class="btn" data-action="tv">' + (S.tv ? "Exit TV mode" : "TV mode") + '</button></div>' +
    '<div class="board-cols">' + cols.map(([k, l]) => {
      const list = sortJobs(all.filter(j => j.status === k));
      return '<div><div class="col-head"><h3>' + l + '</h3><span class="count">' + list.length + '</span></div><div class="col">' +
        (list.length ? list.map(card).join("") : '<div class="col-empty">' + (k === "queued" ? "No sold units waiting." : "None right now.") + '</div>') + '</div></div>';
    }).join("") + '</div></section>' +
    (S.tv ? '<button class="tv-exit" data-action="tv">Exit TV mode</button>' : "");
}

/* --- All stores --- */
function storeStats(id, now){
  const all = byStore(id), act = all.filter(j => j.status !== "delivered");
  const turned = all.filter(j => j.readyAt && isToday(j.readyAt));
  const avg = turned.length ? turned.reduce((s, j) => s + (j.readyAt - j.createdAt), 0) / turned.length : null;
  return {
    act, waiting: act.filter(j => j.status === "queued").length, working: act.filter(j => j.status === "working").length,
    ready: act.filter(j => j.status === "ready").length, over: act.filter(j => urgency(j, now) === "bad"),
    delivered: all.filter(j => j.status === "delivered" && isToday(j.deliveredAt)).length, avg,
    sold: all.filter(j => isToday(j.createdAt)).length
  };
}
function viewStores(){
  const now = Date.now(), tot = storeStats("*", now);
  const tiles = stores().map(s => {
    const st = storeStats(s.id, now);
    const top = sortJobs(st.act.filter(j => j.status !== "ready")).slice(0, 3);
    return '<div class="store-tile' + (st.over.length ? " has-bad" : "") + '"><div class="row"><h3>' + esc(s.name) + '</h3><span class="spacer"></span>' + (st.over.length ? '<span class="flag rush">' + st.over.length + ' overdue</span>' : "") + '</div>' +
      '<div class="tile-counts"><div><b>' + st.waiting + '</b><span>Waiting</span></div><div><b>' + st.working + '</b><span>In progress</span></div><div><b>' + st.ready + '</b><span>Ready</span></div></div>' +
      '<div class="tile-line">Today: <b>' + st.sold + '</b> sold, <b>' + st.delivered + '</b> delivered' + (st.avg ? ', avg turn <b>' + esc(fmtDur(st.avg)) + '</b>' : "") + '</div>' +
      (top.length ? '<div class="mini">' + top.map(j => '<div><span>' + esc(vehicle(j)) + ' #' + esc(j.stock) + '</span><span class="' + (urgency(j, now) === "bad" ? "over" : "muted") + '">' + esc(dueText(j, now)) + '</span></div>').join("") + '</div>' : '<div class="tile-line">Shop is clear.</div>') +
      '<div class="row"><button class="btn primary" data-action="dive" data-store="' + esc(s.id) + '" data-to="board">Open board</button><button class="btn" data-action="dive" data-store="' + esc(s.id) + '" data-to="queue">Queue</button></div></div>';
  }).join("");
  return '<h2>All stores</h2>' +
    '<div class="totals"><div class="total"><b>' + tot.sold + '</b><span>Sold today</span></div><div class="total"><b>' + tot.act.length + '</b><span>On boards now</span></div>' +
    '<div class="total' + (tot.over.length ? " bad" : "") + '"><b>' + tot.over.length + '</b><span>Overdue</span></div><div class="total"><b>' + tot.ready + '</b><span>Ready for delivery</span></div>' +
    '<div class="total"><b>' + (tot.avg ? esc(fmtDur(tot.avg)) : "—") + '</b><span>Avg turn today</span></div></div>' +
    '<div class="store-grid">' + tiles + '</div>';
}

/* --- Setup --- */
function viewSettings(){
  const st = stores();
  return '<div class="narrow settings"><h2>Setup</h2>' +
    '<div class="panel"><h3 style="font-size:22px">Stores</h3><div class="set-list">' +
      (st.length ? ('<div class="set-item muted" style="font-size:13px;font-weight:600"><span style="flex:1">Store</span><span style="width:84px">Store code</span><span style="width:92px"></span></div>') + st.map(s => '<div class="set-item"><input class="input" value="' + esc(s.name) + '" data-action="rename-store" data-id="' + esc(s.id) + '" aria-label="Store name"><input class="input" style="width:84px;flex:none" inputmode="numeric" maxlength="6" value="' + esc(s.code) + '" data-action="store-code" data-k="code" data-id="' + esc(s.id) + '" aria-label="Store code for ' + esc(s.name) + '"><button class="btn danger" data-action="del-store" data-id="' + esc(s.id) + '">Remove</button></div>').join("") : '<p class="muted">No stores yet. Add your first one below.</p>') +
      '</div><form class="set-item" data-form="add-store"><input class="input" name="label" placeholder="Store name, e.g. Ken Garff Honda Downtown" required><button class="btn primary" type="submit">Add</button></form></div>' +
    '<div class="panel"><h3 style="font-size:22px">Access codes</h3><p class="muted">Each device gets locked to one store with that store’s code. Only the PIN below unlocks all stores.</p>' +
      (!S.config.masterPin ? '<div class="warn-box" style="margin-bottom:10px">Set an area manager PIN now. Until you do, anyone can choose Area manager.</div>' : "") +
      (st.some(s => !s.code) ? '<div class="row" style="margin-bottom:10px"><span class="muted">Some stores are missing codes.</span><button class="btn" data-action="gen-codes">Fill in missing codes</button></div>' : "") +
      '<label class="field"><span>Area manager PIN (4–6 digits)</span><input class="input" style="max-width:200px" inputmode="numeric" maxlength="6" value="' + esc(S.config.masterPin) + '" data-action="master-pin"></label></div>' +
    '<div class="panel"><h3 style="font-size:22px">Protection products</h3><p class="muted">What finance and sales can pick from.</p><div class="chips" style="margin:10px 0">' +
      products().map(p => '<span class="pill" style="font-size:15px;padding:6px 6px 6px 12px">' + esc(p) + ' <button class="x" style="width:28px;height:28px;font-size:16px" data-action="del-prod" data-p="' + esc(p) + '" aria-label="Remove ' + esc(p) + '">×</button></span>').join("") +
      '</div><form class="set-item" data-form="add-prod"><input class="input" name="label" placeholder="Add a product" required><button class="btn primary" type="submit">Add</button></form></div>' +
    '<div class="panel"><h3 style="font-size:22px">Setting up a shop TV</h3><p class="muted" style="margin-bottom:0">On the TV’s browser or a cheap stick PC, open this board, choose <b>Detail shop</b>, enter that store’s code, then tap <b>TV mode</b> and <b>Turn on chime</b>. It remembers everything after that.</p></div>' +
    '<div class="panel"><h3 style="font-size:22px">Housekeeping</h3><p class="muted">Delivered units older than 30 days can be cleared to keep the board fast.</p><button class="btn" data-action="cleanup">Clear old delivered units</button></div></div>';
}

/* --- Job sheet --- */
function renderSheet(){
  const root = $("#sheetRoot");
  const j = S.jobs.find(x => x.id === S.sheet.id);
  if (!j){ root.innerHTML = ""; S.sheet = null; return; }
  if (S.sheet.rendered && S.sheet.sig === j.updatedAt) return;
  const keepScroll = root.querySelector(".sheet")?.scrollTop || 0;
  S.sheet.rendered = true; S.sheet.sig = j.updatedAt;
  const p = perms(S.role), now = Date.now(), w = S.canWrite;
  const statusSec = (p.status && w) ? '<div class="sec"><h3>Status</h3><div class="seg">' + Object.keys(STATUS).map(k => '<button data-action="set-status" data-s="' + k + '" aria-pressed="' + (j.status === k) + '">' + STATUS[k] + '</button>').join("") + '</div></div>'
    : (p.deliver && w && j.status === "ready") ? '<div class="sec"><button class="btn primary big" data-action="set-status" data-s="delivered">Mark delivered</button></div>' : "";
  const prodSec = (p.products && w)
    ? '<div class="sec" id="prodSec"><h3>Protection products</h3><div class="chips" data-form="prods">' + products().concat((j.products || []).filter(x => !products().includes(x))).map(x => '<label class="chip-opt"><input type="checkbox" value="' + esc(x) + '"' + ((j.products || []).includes(x) ? " checked" : "") + '><span>' + esc(x) + '</span></label>').join("") + '</div><div class="row" style="margin-top:12px"><button class="btn primary" data-action="save-prods">Save products</button></div></div>'
    : (j.products && j.products.length ? '<div class="sec"><h3>Protection products</h3><div class="chips">' + j.products.map(x => '<span class="pill">' + esc(x) + '</span>').join("") + '</div></div>' : "");
  const dueLocal = j.dueAt ? new Date(j.dueAt - new Date(j.dueAt).getTimezoneOffset() * MIN).toISOString().slice(0,16) : "";
  const editSec = (p.edit && w) ? '<details class="sec"><summary style="font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center">Edit details</summary><form class="form" data-form="edit" style="margin-top:12px">' +
    '<label class="field"><span>Stock number</span><input class="input" name="stock" value="' + esc(j.stock) + '"></label>' +
    '<div class="grid3"><input class="input" name="year" value="' + esc(j.year) + '" aria-label="Year" placeholder="Year"><input class="input" name="make" value="' + esc(j.make) + '" aria-label="Make" placeholder="Make"><input class="input" name="model" value="' + esc(j.model) + '" aria-label="Model" placeholder="Model"></div>' +
    '<label class="field"><span>Color</span><input class="input" name="color" value="' + esc(j.color) + '"></label>' +
    '<label class="field"><span>Salesperson</span><input class="input" name="salesperson" value="' + esc(j.salesperson) + '"></label>' +
    '<label class="field"><span>Ready by</span><input class="input" type="datetime-local" name="due" value="' + esc(dueLocal) + '"></label>' +
    '<div class="toggle-row"><label class="chip-opt"><input type="checkbox" name="waiting"' + (j.waiting ? " checked" : "") + '><span>Customer waiting</span></label><label class="chip-opt"><input type="checkbox" name="rush"' + (j.rush ? " checked" : "") + '><span>Rush</span></label></div>' +
    '<label class="field"><span>Notes</span><textarea class="input" name="notes">' + esc(j.notes) + '</textarea></label>' +
    '<button class="btn primary" type="submit">Save changes</button></form></details>' : "";
  const delSec = (p.del && w) ? '<div class="sec"><button class="btn danger" data-action="del-job">' + (S.sheet.confirmDel ? "Tap again to remove for good" : "Remove from board") + '</button></div>' : "";
  root.innerHTML = '<div class="backdrop" data-action="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
    '<div class="sheet-head"><div style="flex:1;min-width:0"><div class="muted">#' + esc(j.stock) + '  ·  ' + esc(storeName(j.store)) + '</div><h2 id="sheetTitle">' + esc(vehicle(j)) + '</h2><div class="row" style="margin-top:6px"><span class="pill ' + j.status + '">' + STATUS[j.status] + '</span>' + (j.color ? '<span class="muted">' + esc(j.color) + '</span>' : "") + (j.rush ? '<span class="flag rush">Rush</span>' : "") + (j.waiting ? '<span class="flag wait">Customer waiting</span>' : "") + '</div></div><button class="x" data-action="close" aria-label="Close">×</button></div>' +
    '<div class="sec"><dl class="times"><div><dt>Salesperson</dt><dd>' + esc(j.salesperson || "—") + '</dd></div>' + (j.customer ? '<div><dt>Customer</dt><dd>' + esc(j.customer) + '</dd></div>' : "") +
      '<div><dt>Ready by</dt><dd>' + esc(fmtTime(j.dueAt)) + (j.status !== "delivered" && j.status !== "ready" ? ' (' + esc(dueText(j, now)) + ')' : "") + '</dd></div><div><dt>Sent to shop</dt><dd>' + esc(fmtTime(j.createdAt)) + '</dd></div>' +
      (j.status !== "delivered" ? '<div><dt>On board</dt><dd>' + esc(fmtDur(now - j.createdAt)) + '</dd></div>' : "") +
      (j.readyAt ? '<div><dt>Turn time</dt><dd>' + esc(fmtDur(j.readyAt - j.createdAt)) + '</dd></div>' : "") + '</dl>' +
      (j.notes ? '<p style="margin:12px 0 0"><b>Notes:</b> ' + esc(j.notes) + '</p>' : "") + '</div>' +
    statusSec + prodSec + editSec +
    '<div class="sec"><h3>Activity</h3><ul class="log">' + (j.log || []).slice().reverse().slice(0, 12).map(l => '<li><b>' + esc(l.a) + '</b> by ' + esc(l.by) + ', ' + esc(fmtTime(l.t)) + '</li>').join("") + '</ul></div>' +
    delSec + '</div></div>';
  const sh = root.querySelector(".sheet"); sh.scrollTop = keepScroll;
  if (S.sheet.focus === "products" && !S.sheet.focused){ S.sheet.focused = true; root.querySelector("#prodSec")?.scrollIntoView({block:"center"}); }
}
function openSheet(id, focus){ S.sheet = { id, focus }; renderSheet(); setTimeout(() => $("#sheetRoot .x")?.focus(), 30); }
function closeSheet(){ S.sheet = null; $("#sheetRoot").innerHTML = ""; }
function addLog(j, a){ return (j.log || []).concat([{ t: Date.now(), by: S.me || ROLES[S.role].label, a }]).slice(-30); }
async function setStatus(j, to){
  if (j.status === to) return;
  const patch = { status: to, log: addLog(j, "Moved to " + STATUS[to]) };
  if (to === "working" && !j.startedAt) patch.startedAt = Date.now();
  if (to === "ready") patch.readyAt = Date.now();
  if (to === "delivered") patch.deliveredAt = Date.now();
  if (to === "queued"){ patch.readyAt = null; patch.deliveredAt = null; }
  try{ await api.update(j.id, patch); toast(vehicle(j) + " is now " + STATUS[to].toLowerCase()); }catch(e){}
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-action]"); if (!t) return;
  const a = t.dataset.action;
  if (a === "close-bg"){ if (e.target === t) closeSheet(); return; }
  if (t.tagName === "SELECT" || t.tagName === "INPUT") return;
  const job = id => S.jobs.find(j => j.id === (id || t.dataset.id || (S.sheet && S.sheet.id)));
  switch (a){
    case "release-start": S.releasing = true; render(true); break;
    case "release-cancel": S.releasing = false; render(true); break;
    case "pick-role": S.role = t.dataset.role; LS.set("role", S.role); S.view = null; S.skipName = false; render(true); break;
    case "switch-role": S.role = null; S.unlock = null; LS.set("unlock", null); S.releasing = false; LS.set("role", null); S.tv = false; render(true); break;
    case "pick-store": setUnlock(t.dataset.store); render(true); break;
    case "tab": S.view = t.dataset.tab; S.addDone = null; render(true); window.scrollTo(0,0); break;
    case "filter": S.filter = t.dataset.f; render(true); break;
    case "open": openSheet(t.dataset.id, t.dataset.focus); break;
    case "close": closeSheet(); break;
    case "advance": { const j = job(); const n = j && nextStep(j); if (n) await setStatus(j, n.to); break; }
    case "set-status": { const j = job(); if (j) await setStatus(j, t.dataset.s); break; }
    case "save-prods": { const j = job(); if (!j) break;
      const sel = [...document.querySelectorAll('[data-form="prods"] input:checked')].map(i => i.value);
      try{ await api.update(j.id, { products: sel, log: addLog(j, "Products updated (" + (sel.length ? sel.join(", ") : "none") + ")") }); toast("Products saved"); }catch(err){} break; }
    case "del-job": { const j = job(); if (!j) break;
      if (!S.sheet.confirmDel){ S.sheet.confirmDel = true; S.sheet.rendered = false; renderSheet(); setTimeout(() => { if (S.sheet){ S.sheet.confirmDel = false; S.sheet.rendered = false; renderSheet(); } }, 5000); break; }
      try{ await api.remove(j.id); closeSheet(); toast("Removed from the board"); }catch(err){} break; }
    case "add-another": S.addDone = null; render(true); break;
    case "dive": S.store = t.dataset.store; LS.set("store", S.store); S.view = t.dataset.to; render(true); window.scrollTo(0,0); break;
    case "sound":
      S.sound = !S.sound;
      if (S.sound){ try{ audio = audio || new (window.AudioContext || window.webkitAudioContext)(); await audio.resume(); }catch(err){} chime(); }
      LS.set("sound", S.sound); render(true); break;
    case "tv":
      S.tv = !S.tv;
      try{ if (S.tv && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); else if (!S.tv && document.fullscreenElement) await document.exitFullscreen(); }catch(err){}
      render(true); break;
    case "del-store": {
      const id = t.dataset.id, n = activeJobs(id).length;
      if (n){ toast("That store still has " + n + " unit" + (n > 1 ? "s" : "") + " on its board. Clear them first.", true); break; }
      await api.saveConfig(Object.assign({}, S.config, { stores: stores().filter(s => s.id !== id) })).catch(()=>{}); render(true); break; }
    case "del-prod": await api.saveConfig(Object.assign({}, S.config, { products: products().filter(p => p !== t.dataset.p) })).catch(()=>{}); render(true); break;
    case "gen-codes": {
      const used = allCodes();
      const next = stores().map(s => { const o = Object.assign({}, s); if (!o.code){ o.code = newCode(used); used.push(o.code); } return o; });
      await api.saveConfig(Object.assign({}, S.config, { stores: next })).catch(()=>{}); render(true); break; }
    case "logo-clear": await api.saveConfig(Object.assign({}, S.config, { logoId: null })).catch(()=>{}); render(true); break;
    case "cleanup": {
      const old = S.jobs.filter(j => j.status === "delivered" && (j.deliveredAt || 0) < Date.now() - 30 * 24 * HOUR);
      if (!old.length){ toast("Nothing to clear."); break; }
      t.disabled = true;
      for (const j of old){ try{ await api.remove(j.id); }catch(err){ break; } }
      toast("Cleared " + old.length + " old units"); render(true); break; }
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.action === "store"){ S.store = t.value; LS.set("store", S.store); render(true); }
  if (t.dataset.action === "rename-store"){
    const name = t.value.trim(); if (!name) return;
    await api.saveConfig(Object.assign({}, S.config, { stores: stores().map(s => s.id === t.dataset.id ? Object.assign({}, s, { name }) : s) })).catch(()=>{});
    toast("Store renamed");
  }
  if (t.dataset.action === "store-code" || t.dataset.action === "master-pin"){
    const v = t.value.trim();
    if (!/^\d{4,6}$/.test(v)){ toast("Codes need to be 4 to 6 digits.", true); render(true); return; }
    const mine = t.dataset.action === "master-pin" ? String(S.config.masterPin) : String((stores().find(s => s.id === t.dataset.id) || {})[t.dataset.k] || "");
    if (v !== mine && allCodes().includes(v)){ toast("That code is already used. Every code has to be different.", true); render(true); return; }
    if (t.dataset.action === "master-pin"){ await api.saveConfig(Object.assign({}, S.config, { masterPin: v })).catch(()=>{}); setUnlock("*"); toast("Area manager PIN saved"); render(true); return; }
    await api.saveConfig(Object.assign({}, S.config, { stores: stores().map(s => s.id === t.dataset.id ? Object.assign({}, s, { [t.dataset.k]: v }) : s) })).catch(()=>{});
    toast("Code saved"); return;
  }
  if (false){
    try{}
    catch(err){ toast("That logo didn't upload. Try a PNG or SVG under 2 MB.", true); }
  }
});
document.addEventListener("submit", async e => {
  const f = e.target; e.preventDefault();
  const kind = f.dataset.form;
  if (kind === "add") return submitAdd(f);
  if (kind === "code") return tryCode(f);
  if (kind === "release"){
    const v = String(f.code.value || "").trim();
    if (Date.now() < codeWaitUntil){ $("#codeErr").innerHTML = '<div class="err-msg">Too many tries. Wait a minute.</div>'; return; }
    if (S.config.masterPin && v === String(S.config.masterPin)){ S.lock = null; LS.set("lock", null); S.releasing = false; toast("Store unlocked. Pick a role, then enter the new store’s code."); render(true); }
    else { codeTries++; if (codeTries >= 5){ codeTries = 0; codeWaitUntil = Date.now() + 60000; } $("#codeErr").innerHTML = '<div class="err-msg" role="alert">That PIN didn’t match.</div>'; f.code.value = ""; }
    return;
  }
  if (kind === "name"){ const v = f.me.value.trim(); if (!v) return; S.me = v; LS.set("me", v); render(true); return; }
  if (kind === "add-store"){
    const name = f.label.value.trim(); if (!name) return;
    if (stores().some(s => s.name.toLowerCase() === name.toLowerCase())){ toast("That store is already on the list.", true); return; }
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24) + "-" + uid().slice(0, 4);
    await api.saveConfig(Object.assign({}, S.config, { stores: stores().concat([(() => { const used = allCodes(); const code = newCode(used); return { id, name, code, mcode: "" }; })()]) })).catch(()=>{});
    render(true); document.querySelector('[data-form="add-store"] input')?.focus(); return;
  }
  if (kind === "add-prod"){
    const name = f.label.value.trim(); if (!name || products().includes(name)) return;
    await api.saveConfig(Object.assign({}, S.config, { products: products().concat([name]) })).catch(()=>{}); render(true); return;
  }
  if (kind === "edit"){
    const j = S.jobs.find(x => x.id === S.sheet.id); if (!j) return;
    const fd = new FormData(f), g = k => String(fd.get(k) || "").trim();
    const due = g("due") ? new Date(g("due")).getTime() : j.dueAt;
    if (!g("stock")){ toast("Stock number can't be blank.", true); return; }
    if (!isNaN(due) && Math.abs(due - (j.dueAt || 0)) > MIN && due < Date.now() + HOUR - MIN){ toast("Ready time has to be at least 1 hour from now.", true); return; }
    try{
      await api.update(j.id, { stock: g("stock").toUpperCase(), year: g("year"), make: g("make"), model: g("model"), color: g("color"), salesperson: g("salesperson"),
        dueAt: isNaN(due) ? j.dueAt : due, waiting: !!fd.get("waiting"), rush: !!fd.get("rush"), notes: g("notes"), log: addLog(j, "Details edited") });
      toast("Changes saved");
    }catch(err){}
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (S.sheet) closeSheet(); else if (S.tv){ S.tv = false; render(true); } } });
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && S.tv){ S.tv = false; render(true); } });

/* ---------- live ticking (display only, no writes) ---------- */
setInterval(() => {
  const now = Date.now();
  for (const [id, exp] of S.newIds) if (exp < now) S.newIds.delete(id);
  if (!FORM_VIEWS.has(S.view)) renderMain();
}, 20000);

/* ---------- boot ---------- */
function handleJobsSnap(docs, changes){
  S.jobs = docs;
  const mine = S.store;
  changes.forEach(j => {
    if (j.createdAt > boot && (mine === "*" || j.store === mine)){
      S.newIds.set(j.id, Date.now() + 15 * MIN);
      if (S.view === "board" || S.role === "shop"){ arrival(j); chime(); }
    }
  });
  S.loaded = true; render();
}
function readCfg(d){
  d = d || {};
  S.config = { stores: (d.stores || []).map(s => ({ id: s.id, name: s.name, code: s.code || "", mcode: s.mcode || "" })), products: d.products ? d.products.slice() : null, logoId: null, masterPin: d.masterPin || "" };
}
async function loadAll(){
  const [c, jr] = await Promise.all([
    db.from("config").select("data").eq("id", "settings").maybeSingle(),
    db.from("jobs").select("id,data").order("created_at", { ascending: false }).limit(900)
  ]);
  if (c.error || jr.error) throw (c.error || jr.error);
  const before = new Set(S.jobs.map(j => j.id)), first = !S.loaded;
  readCfg(c.data && c.data.data);
  const docs = jr.data.map(r => Object.assign({ id: r.id }, r.data));
  const added = first ? [] : docs.filter(d => !before.has(d.id) && !mine.has(d.id));
  S.online = true;
  handleJobsSnap(docs, added);
}
render(true);
(async () => {
  const configured = window.supabase && SUPABASE_URL.startsWith("http") && SUPABASE_KEY.length > 20;
  if (!configured){ S.loaded = true; S.live = false; S.config = { stores: [{ id: "demo-1", name: "Demo store" }], products: null, logoId: null }; render(true); return; }
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
  S.live = true;
  let lastSync = 0;
  const refresh = () => loadAll().then(() => { lastSync = Date.now(); S.lastErr = ""; renderShell(); })
    .catch(e => { S.online = false; S.lastErr = (e && (e.message || e.code)) || "unknown"; renderShell(); });
  try{ await loadAll(); }catch(e){ S.loaded = true; S.online = false; render(true); }
  db.channel("board")
    .on("postgres_changes", { event: "*", schema: "public", table: "jobs" }, p => {
      if (p.eventType === "DELETE"){ S.jobs = S.jobs.filter(j => j.id !== (p.old && p.old.id)); render(); return; }
      const row = p.new; if (!row || !row.data) return;
      const j = Object.assign({ id: row.id }, row.data);
      const isNew = p.eventType === "INSERT" && !S.jobs.some(x => x.id === j.id) && !mine.has(j.id);
      upsertLocal(j); S.jobs.sort((a, b) => b.createdAt - a.createdAt);
      handleJobsSnap(S.jobs, isNew ? [j] : []);
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "config" }, p => {
      if (p.new && p.new.data){ readCfg(p.new.data); render(S.view === "settings"); }
    })
    .subscribe(status => { if (status === "SUBSCRIBED"){ S.rt = true; refresh(); } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") S.rt = false; });
  // Safety net: if live updates drop, check every 15 seconds; otherwise every 2 minutes. Also when the screen wakes up.
  setInterval(() => { if (!S.rt || Date.now() - lastSync > 120000) refresh(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  window.addEventListener("online", refresh);
})();
S.sound = false; // browsers need a tap each visit to allow sound
})();
</script>
